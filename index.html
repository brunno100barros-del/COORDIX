<title>COORDIX</title>
<link rel="icon" href="marca/coordix-icone.svg" type="image/svg+xml">
<script>/* tema salvo (chave própria, fora do bimora.v1); sem preferência, segue o sistema */
try{var t=localStorage.getItem("coordix.tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   COORDIX · sistema de design "Industrial Precision"
   Tudo deriva dos tokens abaixo (cores, tipografia, espaçamento, bordas,
   sombras e estados). Tema: html[data-theme="light"|"dark"]; sem atributo,
   segue o sistema. O ambiente 3D tem tokens próprios (--viewer-*), para
   que a troca de tema da interface não prejudique a leitura da geometria.
   Layout: trilho de módulos à esquerda, área de trabalho à direita; o
   visualizador é um único canvas que muda de lugar entre Visualizador e Revisão.
   ===================================================================== */
:root{
  /* tipografia */
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --fs-2xs:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:13.5px; --fs-lg:15px; --fs-xl:24px;
  --track-caps:.08em;
  /* espaçamento (base 4) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  /* geometria dos componentes */
  --r-1:2px; --r-2:3px; --r-pill:999px;
  --bw:1px; --bar:3px;
  --h-top:50px; --w-rail:212px; --h-ctl:30px; --h-ctl-sm:24px;
  /* movimento */
  --t-fast:.12s; --t-theme:.22s; --ease:cubic-bezier(.2,.6,.2,1);

  /* ---------- tema claro ---------- */
  --bg:#e8eaed; --surface:#fbfbfc; --surface-2:#f2f3f5; --surface-3:#e5e7eb;
  --ink:#12151a; --ink-2:#2c3139; --muted:#5b6370; --faint:#8b929c;
  --line:#d6d9de; --line-strong:#b4bac3;
  --brand:#12151a; --brand-ink:#ffffff;
  --accent:#a84d1c; --accent-ink:#ffffff; --accent-soft:#f5e7dc; --accent-line:#dfb391;  /* cobre da íris */
  --focus:#2a62c4; --hover:rgba(18,21,26,.045); --press:rgba(18,21,26,.08);
  --sel:rgba(168,77,28,.09);
  --p1:#c22d26; --p2:#c9650f; --p3:#9c7a00; --p4:#287a4b; --info:#2d65a3; --fake:#677080; --ok:#287a4b;
  --shadow-float:0 1px 0 rgba(16,20,28,.04),0 8px 24px -10px rgba(16,20,28,.32);
  --toast-bg:#12151a; --toast-ink:#f3f4f6;
  /* símbolo */
  --cx-traco:var(--ink); --cx-iris:#6b3a1f; --cx-limbo:#3a1f10; --cx-pupila:#140b06; --cx-brilho:#ffffff;
  /* ambiente 3D (independente da interface) */
  --viewer:#d7dbe1; --viewer-grid:#b9c0c9; --viewer-grid-major:#8f98a4; --viewer-ink:#12151a; --viewer-chrome:rgba(251,251,252,.94); --viewer-sel:#ef7a2a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --surface:#121519; --surface-2:#171a1f; --surface-3:#1e2228;
  --ink:#e6e8eb; --ink-2:#c7cbd1; --muted:#949ba6; --faint:#69707b;
  --line:#242930; --line-strong:#353b44;
  --brand:#e6e8eb; --brand-ink:#0b0d10;
  --accent:#de7d43; --accent-ink:#0b0d10; --accent-soft:#2a1b12; --accent-line:#6b3e22;
  --focus:#6d9df0; --hover:rgba(230,232,235,.05); --press:rgba(230,232,235,.09);
  --sel:rgba(222,125,67,.13);
  --p1:#f0625a; --p2:#f09347; --p3:#dcb43a; --p4:#59bd7d; --info:#6aa0e6; --fake:#8f98a8; --ok:#59bd7d;
  --shadow-float:0 1px 0 rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
  --toast-bg:#e6e8eb; --toast-ink:#0b0d10;
  --cx-iris:#9a5a32; --cx-limbo:#4a2a16;
  --viewer:#181b20; --viewer-grid:#262b33; --viewer-grid-major:#39404a; --viewer-ink:#e6e8eb; --viewer-chrome:rgba(18,21,25,.92);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#121519; --surface-2:#171a1f; --surface-3:#1e2228;
  --ink:#e6e8eb; --ink-2:#c7cbd1; --muted:#949ba6; --faint:#69707b;
  --line:#242930; --line-strong:#353b44;
  --brand:#e6e8eb; --brand-ink:#0b0d10;
  --accent:#de7d43; --accent-ink:#0b0d10; --accent-soft:#2a1b12; --accent-line:#6b3e22;
  --focus:#6d9df0; --hover:rgba(230,232,235,.05); --press:rgba(230,232,235,.09);
  --sel:rgba(222,125,67,.13);
  --p1:#f0625a; --p2:#f09347; --p3:#dcb43a; --p4:#59bd7d; --info:#6aa0e6; --fake:#8f98a8; --ok:#59bd7d;
  --shadow-float:0 1px 0 rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
  --toast-bg:#e6e8eb; --toast-ink:#0b0d10;
  --cx-iris:#9a5a32; --cx-limbo:#4a2a16;
  --viewer:#181b20; --viewer-grid:#262b33; --viewer-grid-major:#39404a; --viewer-ink:#e6e8eb; --viewer-chrome:rgba(18,21,25,.92);
  color-scheme:dark}

/* ---------- base ---------- */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-md)/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important} /* componentes com display próprio (legenda, avisos) respeitam o atributo hidden */
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color var(--t-theme) var(--ease),border-color var(--t-theme) var(--ease),color var(--t-theme) var(--ease),fill var(--t-theme) var(--ease),stroke var(--t-theme) var(--ease)!important}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--w-rail) 1fr;grid-template-rows:var(--h-top) 1fr;height:100%;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* barra superior: células separadas por fios, como o carimbo de uma prancha */
.top{grid-column:1/-1;display:flex;align-items:stretch;background:var(--surface);border-bottom:var(--bw) solid var(--line-strong);min-width:0}
.top > *{display:flex;align-items:center}
.logo{--logo-mark-dy:-4px; /* pupila entre as linhas COORDIX e BIMOFFICE, um pouco mais perto de COORDIX */
  width:var(--w-rail);flex:none;gap:10px;padding-inline:var(--sp-4);border-right:var(--bw) solid var(--line);color:var(--ink);
  font:700 18px/1 var(--font-cond);letter-spacing:.14em}
.logo .logo-mark{width:44px;height:30px;flex:none;overflow:visible;margin-left:-2px;transform:translateY(var(--logo-mark-dy,0px))}
.logo .logo-word{display:flex;flex-direction:column;gap:3px}
.logo-sub{font:600 8.5px/1 var(--font-mono);letter-spacing:.26em;color:var(--muted)}
.logo-mark .cx-palpebra,.logo-mark .cx-cilios{fill:var(--cx-traco)}
.logo-mark .cx-inferior{stroke:var(--cx-traco);opacity:.5}
.logo-mark .cx-iris{fill:var(--cx-iris)} .logo-mark .cx-limbo{stroke:var(--cx-limbo)}
.logo-mark .cx-pupila{fill:var(--cx-pupila)} .logo-mark .cx-brilho{fill:var(--cx-brilho)}
.projsel{gap:var(--sp-2);min-width:0;padding-inline:var(--sp-4);border-right:var(--bw) solid var(--line)}
.projsel .lbl{font:600 var(--fs-2xs)/1 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--faint)}
.projsel select{max-width:340px;min-width:0;height:var(--h-ctl);border-color:transparent;background-color:transparent;font:600 var(--fs-lg)/1 var(--font-cond);letter-spacing:.01em;padding-inline:6px 26px}
.projsel select:hover{background-color:var(--hover)}
.top .grow{flex:1}
.top .tools{gap:var(--sp-2);padding-inline:var(--sp-3);border-left:var(--bw) solid var(--line)}
.top .tools:empty{display:none}

.pill{display:inline-flex;align-items:center;gap:8px;height:var(--h-ctl-sm);padding:0 10px;border-radius:var(--r-1);font:500 var(--fs-sm)/1 var(--font);border:var(--bw) solid var(--line);background:var(--surface-2);cursor:pointer;white-space:nowrap}
.pill.warn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink);box-shadow:inset var(--bar) 0 0 var(--accent)}
.pill.warn .num{font:600 var(--fs-sm)/1 var(--font-mono);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:0;background:var(--accent);transform:rotate(45deg)}
.pill:hover{border-color:var(--accent)}

/* alternância de tema */
.theme-tg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:var(--r-1);background:var(--surface-2);padding:2px;gap:2px}
.theme-tg button{display:grid;place-items:center;width:28px;height:22px;border:0;border-radius:1px;background:none;color:var(--faint);cursor:pointer}
.theme-tg button svg{width:15px;height:15px}
.theme-tg button:hover{color:var(--ink)}
.theme-tg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 var(--bw) var(--line-strong)}

/* menu lateral */
nav.rail{background:var(--surface);border-right:var(--bw) solid var(--line);padding:var(--sp-3) 0 var(--sp-4);display:flex;flex-direction:column;gap:1px;overflow:auto}
nav.rail .rail-sec{font:600 var(--fs-2xs)/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:var(--sp-3) var(--sp-4) var(--sp-2)}
nav.rail .rail-sec:first-child{padding-top:var(--sp-1)}
nav.rail button{position:relative;display:flex;align-items:center;gap:11px;width:100%;height:34px;padding:0 var(--sp-4);border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font:500 var(--fs-md)/1 var(--font)}
nav.rail button svg{width:17px;height:17px;flex:none;stroke-width:1.6}
nav.rail button:hover{background:var(--hover);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
nav.rail button[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:var(--bar);background:var(--accent)}
nav.rail button[aria-current="page"] svg{color:var(--accent)}
nav.rail .step{margin-left:auto;font:500 var(--fs-2xs)/1 var(--font-mono);color:var(--faint);letter-spacing:.04em}
nav.rail .sep{height:var(--bw);background:var(--line);margin:var(--sp-2) var(--sp-4) 0}
nav.rail .badge{margin-left:auto;min-width:22px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-1);font:600 var(--fs-2xs)/1 var(--font-mono);padding:4px 5px}

/* área de trabalho */
main{overflow:auto;min-width:0;position:relative}
.view{padding-block:var(--sp-6) var(--sp-8);padding-left:max(var(--sp-6),env(safe-area-inset-left,0px));padding-right:max(var(--sp-6),env(safe-area-inset-right,0px));max-width:1320px}
.view.full{max-width:none;height:100%;padding:0;display:grid}
h1{font:600 var(--fs-xl)/1.15 var(--font-cond);letter-spacing:.005em;margin:0 0 6px;text-wrap:balance}
h2{display:flex;align-items:center;gap:8px;font:600 var(--fs-xs)/1.3 var(--font-mono);margin:0;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--muted)}
h3{font:600 var(--fs-lg)/1.3 var(--font);margin:0}
.lede{color:var(--muted);margin:0 0 var(--sp-5);max-width:76ch}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}

/* painel: cabeçalho em faixa (título de prancha) */
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-2);padding:var(--sp-4);min-width:0}
.panel > h2:first-child{margin:calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4)) var(--sp-1);padding:10px var(--sp-4);border-bottom:var(--bw) solid var(--line);background:var(--surface-2);border-radius:var(--r-2) var(--r-2) 0 0}
.panel > h2:first-child::before{content:"";width:var(--bar);height:11px;background:var(--accent)}
.panel.stack > h2:first-child{margin-bottom:calc(var(--sp-1) - var(--sp-4) + var(--sp-3))}
.panel > .row:first-child h2::before{content:"";width:var(--bar);height:11px;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--sp-4)}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-ctl);padding:0 12px;border-radius:var(--r-1);border:var(--bw) solid var(--line-strong);background:var(--surface);cursor:pointer;font:500 var(--fs-md)/1 var(--font);white-space:nowrap;
  transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.btn:hover{border-color:var(--ink-2);background:var(--surface-2)}
.btn:active{background:var(--press)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.accent:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);border-color:transparent;color:var(--ink)}
.btn.small{height:var(--h-ctl-sm);padding:0 8px;font-size:var(--fs-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=number],select,textarea{height:var(--h-ctl);padding:0 8px;border:var(--bw) solid var(--line-strong);border-radius:var(--r-1);background:var(--surface);min-width:0;
  transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea{height:auto;padding:6px 8px;width:100%;resize:vertical}
select{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
input:hover,select:hover,textarea:hover{border-color:var(--ink-2)}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.fld{display:flex;flex-direction:column;gap:5px;font:600 var(--fs-2xs)/1.2 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--muted);min-width:0}
label.fld input,label.fld textarea,label.fld select{color:var(--ink);font:400 var(--fs-md)/1.4 var(--font);letter-spacing:0;text-transform:none}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-md)}
th{font:600 var(--fs-2xs)/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--muted);text-align:left;padding:9px 10px;border-bottom:var(--bw) solid var(--line-strong);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 10px;border-bottom:var(--bw) solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.panel > .tbl-wrap:only-child,.panel > .tbl-wrap:first-child{margin:calc(-1 * var(--sp-4))}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
tr.click:hover td:first-child{box-shadow:inset var(--bar) 0 0 var(--accent)}
td input[type=text],td input[type=email],td input[type=number],td select{width:100%}
td.tight{width:1%;white-space:nowrap}

/* indicadores: classificação, status e revisão (marca lateral + tinta da cor) */
.chip{--c:var(--fake);display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 9px;border-radius:var(--r-1);font:600 var(--fs-xs)/1 var(--font-mono);letter-spacing:.01em;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:inset var(--bar) 0 0 var(--c)}
.chip.P1{--c:var(--p1)} .chip.P2{--c:var(--p2)} .chip.P3{--c:var(--p3)} .chip.P4{--c:var(--p4)} .chip.INFO{--c:var(--info)} .chip.FALSO{--c:var(--fake)}
.chip.P1{color:#fff;background:var(--p1);box-shadow:none}
.chip.outline{--c:var(--muted);background:none;box-shadow:inset 0 0 0 var(--bw) var(--line-strong);color:var(--muted);font-weight:500;padding:0 7px}
.chip.sug{--c:var(--accent);background:none;box-shadow:none;outline:var(--bw) dashed var(--accent-line);outline-offset:-1px;color:var(--ink-2);font-weight:500;padding:0 7px}
.chip.sug::before{content:"";width:5px;height:5px;background:var(--accent);transform:rotate(45deg)}
.chip.ok{--c:var(--ok);background:none;box-shadow:inset 0 0 0 var(--bw) color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);font-weight:500;padding:0 7px}
.chip.geo{--c:var(--p2);background:color-mix(in srgb,var(--p2) 8%,transparent);box-shadow:inset 0 0 0 var(--bw) color-mix(in srgb,var(--p2) 50%,transparent);color:var(--ink-2);font-weight:500;padding:0 7px}
.sevbar{display:flex;height:8px;gap:1px;background:var(--surface-3)}
.sevbar span{display:block;height:100%}

.alert{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;padding:12px var(--sp-4);border-radius:var(--r-2);border:var(--bw) solid var(--accent-line);background:var(--accent-soft);box-shadow:inset var(--bar) 0 0 var(--accent)}
.alert b{font-weight:600}
.alert .grow{flex:1;min-width:200px}
.empty{padding:28px;text-align:center;color:var(--muted);border:var(--bw) dashed var(--line-strong);border-radius:var(--r-2);
  background:repeating-linear-gradient(-45deg,transparent 0 7px,var(--hover) 7px 8px)}

.drop{border:var(--bw) dashed var(--line-strong);border-radius:var(--r-2);padding:28px;text-align:center;cursor:pointer;background:var(--surface);transition:border-color var(--t-fast),background-color var(--t-fast)}
.drop:hover{border-color:var(--ink-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{height:3px;background:var(--surface-3);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* ---------- visualizador ---------- */
.vlayout{display:grid;grid-template-columns:272px 1fr 352px;height:100%;min-height:0}
.vside{background:var(--surface);overflow:auto;min-width:0;min-height:0}
.vside.left{border-right:var(--bw) solid var(--line)}
.vside.right{border-left:var(--bw) solid var(--line)}
.vside .hd{position:sticky;top:0;background:var(--surface);padding:12px var(--sp-4) 10px;border-bottom:var(--bw) solid var(--line);z-index:1}
.slot{position:relative;min-width:0;min-height:0;background:var(--viewer)}
#viewer{position:absolute;inset:0}
#viewer canvas{display:block;width:100%;height:100%}
/* marcas de enquadramento nos cantos da viewport */
#viewer::after{content:"";position:absolute;inset:8px;pointer-events:none;z-index:1;opacity:.55;
  background:
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) top left/14px 1px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) top left/1px 14px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) top right/14px 1px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) top right/1px 14px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) bottom left/14px 1px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) bottom left/1px 14px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) bottom right/14px 1px,
    linear-gradient(var(--viewer-grid-major),var(--viewer-grid-major)) bottom right/1px 14px;
  background-repeat:no-repeat}
.vtools{position:absolute;top:14px;left:14px;display:flex;flex-wrap:wrap;z-index:2;background:var(--viewer-chrome);border:var(--bw) solid var(--line);border-radius:var(--r-2);box-shadow:var(--shadow-float);padding:2px;gap:2px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vtools .btn{border-color:transparent;background:none;height:26px;color:var(--ink-2)}
.vtools .btn:hover{background:var(--hover);color:var(--ink)}
.vtools .btn svg{width:14px;height:14px}
.vtools .btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.vtools .vt-sep{width:var(--bw);background:var(--line);margin:4px 2px}
.vstatus{position:absolute;left:14px;bottom:14px;font:500 var(--fs-xs)/1.3 var(--font-mono);color:var(--ink-2);background:var(--viewer-chrome);border:var(--bw) solid var(--line);padding:5px 9px 5px 22px;border-radius:var(--r-1);z-index:2;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vstatus::before{content:"";position:absolute;left:9px;top:50%;width:5px;height:5px;margin-top:-3px;background:var(--accent);transform:rotate(45deg)}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);z-index:1;pointer-events:none}
.legend{position:absolute;right:14px;bottom:14px;background:var(--viewer-chrome);border:var(--bw) solid var(--line);border-radius:var(--r-2);padding:8px 10px;font:500 var(--fs-xs)/1.3 var(--font);display:flex;flex-direction:column;gap:5px;z-index:2;box-shadow:var(--shadow-float);max-width:min(320px,calc(100% - 28px))}
.legend i{display:inline-block;width:12px;height:12px;border-radius:1px;margin-right:7px;vertical-align:-2px}
.legend .muted{font:500 var(--fs-2xs)/1 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;padding-top:5px;border-top:var(--bw) solid var(--line)}

/* árvore de modelos e pavimentos */
.tree{list-style:none;margin:0;padding:6px 0 16px}
.tree ul{list-style:none;margin:0;padding-left:0}
.tree ul .node{padding-left:28px}
.tree ul ul .node{padding-left:46px}
.tree .node{position:relative;display:flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 10px;cursor:pointer;font-size:var(--fs-sm);min-width:0}
.tree .node:hover{background:var(--hover)}
.tree .node.sel{background:var(--sel);box-shadow:inset var(--bar) 0 0 var(--accent)}
.tree .node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .node .ct{font:500 var(--fs-2xs)/1 var(--font-mono);color:var(--muted);background:var(--surface-2);border:var(--bw) solid var(--line);padding:2px 5px;border-radius:var(--r-1)}
.tree .model{border-bottom:var(--bw) solid var(--line)}
.tree .model > .node{font-weight:600;height:34px;font-size:var(--fs-md)}
.tree ul > li > .node::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:var(--bw);background:var(--line)}
.tree ul ul > li > .node::before{left:35px}
.tree .node .btn.ghost{height:20px;color:var(--muted)}
.tree input[type=checkbox]{margin:0}
.tree .caret{width:12px;text-align:center;color:var(--faint);font-size:9px}

/* propriedades */
.tabs{display:flex;gap:0;border-bottom:var(--bw) solid var(--line);padding-inline:var(--sp-4);background:var(--surface)}
.tabs button{border:0;background:none;height:36px;padding:0 12px;cursor:pointer;color:var(--muted);font:600 var(--fs-2xs)/1 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.props{width:100%;font-size:var(--fs-sm)}
.props td{padding:6px var(--sp-4);border-bottom:var(--bw) solid var(--line);vertical-align:top;word-break:break-word}
.props td:first-child{color:var(--muted);width:42%;padding-right:8px}
.props td:last-child{font-family:var(--font);color:var(--ink)}
.props tr.grp td{background:var(--surface-2);font:600 var(--fs-2xs)/1.2 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-2);cursor:pointer;padding-block:8px}
.props tr.hl td{background:var(--sel)}
.props tr.hl td:first-child{box-shadow:inset var(--bar) 0 0 var(--accent);color:var(--ink);font-weight:600}
.props .fx{opacity:0;border:0;background:none;cursor:pointer;color:var(--accent);padding:0 2px;font:500 var(--fs-2xs)/1 var(--font-mono);letter-spacing:.02em}
.props tr:hover .fx,.props .fx:focus-visible{opacity:1}
details.pset{border-bottom:var(--bw) solid var(--line)}
details.pset summary{display:flex;align-items:baseline;gap:6px;padding:8px var(--sp-4);cursor:pointer;font-weight:600;font-size:var(--fs-sm);background:var(--surface-2);list-style:none}
details.pset summary::-webkit-details-marker{display:none}
details.pset summary::before{content:"";flex:none;width:0;height:0;border:4px solid transparent;border-left:5px solid var(--faint);transform:translateY(-1px);transition:transform var(--t-fast)}
details.pset[open] summary::before{transform:translate(1px,1px) rotate(90deg)}
details.pset summary .muted{font:500 var(--fs-2xs)/1 var(--font-mono);letter-spacing:.02em}

/* ---------- clashes por nível ---------- */
.lvl{border:var(--bw) solid var(--line);border-radius:var(--r-2);background:var(--surface);overflow:hidden}
.lvl > summary{display:flex;align-items:center;gap:var(--sp-3);padding:12px var(--sp-4);cursor:pointer;list-style:none;flex-wrap:wrap;border-bottom:var(--bw) solid transparent}
.lvl[open] > summary{border-bottom-color:var(--line-strong)}
.lvl > summary:hover{background:var(--hover)}
.lvl > summary::-webkit-details-marker{display:none}
/* marcador de nível (convenção de desenho: triângulo de cota) */
.lvl > summary .name{display:inline-flex;align-items:center;gap:10px;font:600 17px/1 var(--font-cond);text-transform:uppercase;letter-spacing:.06em;min-width:160px}
.lvl > summary .name::before{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ink);box-shadow:0 2px 0 -1px var(--ink)}
.lvl > summary .count{font:600 var(--fs-xs)/1 var(--font-mono);color:var(--ink-2);border:var(--bw) solid var(--line-strong);border-radius:var(--r-1);padding:4px 8px}
.lvl > summary .chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.lvl .tbl-wrap table th{background:var(--surface-2)}
.seg{display:inline-flex;border:var(--bw) solid var(--line-strong);border-radius:var(--r-1);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:28px;padding:0 12px;cursor:pointer;font:500 var(--fs-sm)/1 var(--font);color:var(--muted);border-right:var(--bw) solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* ---------- revisão ---------- */
.rlayout{display:grid;grid-template-columns:292px 1fr 392px;height:100%;min-height:0}
.qitem{position:relative;display:flex;gap:10px;align-items:flex-start;padding:9px var(--sp-4);border-bottom:var(--bw) solid var(--line);cursor:pointer}
.qitem:hover{background:var(--hover)}
.qitem.sel{background:var(--sel);box-shadow:inset var(--bar) 0 0 var(--accent)}
.qitem .t{font-weight:600;font-size:12.5px}
.qitem .s{font-size:var(--fs-xs);color:var(--muted)}
.qgroup{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:8px var(--sp-4);font:600 var(--fs-2xs)/1 var(--font-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);background:var(--surface-2);border-bottom:var(--bw) solid var(--line)}
.qgroup::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--ink-2)}
.vside.left .hd + #queue .qgroup{top:0}
.card{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.card > .row:first-child{padding-bottom:var(--sp-3);border-bottom:var(--bw) solid var(--line)}
.elbox{border:var(--bw) solid var(--line);border-radius:var(--r-2);padding:9px 11px;font-size:var(--fs-sm);display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.elbox .hdr{display:flex;align-items:center;gap:7px;font-weight:600;font-size:var(--fs-md)}
.elbox .mono{font-size:11px}
.sw{width:11px;height:11px;border-radius:1px;display:inline-block;flex:none}
.reason{font-size:var(--fs-sm);padding:9px 12px;border-left:var(--bar) solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-2) var(--r-2) 0}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;font-size:var(--fs-md);align-items:center}
.kv > span:nth-child(odd){color:var(--muted);font-size:var(--fs-sm)}
.snaps{display:flex;gap:6px;flex-wrap:wrap}
.snaps img{width:96px;height:64px;object-fit:cover;border-radius:var(--r-1);border:var(--bw) solid var(--line-strong)}
.cmt{font-size:var(--fs-sm);border-left:2px solid var(--line-strong);padding:3px 0 3px 10px}
kbd{font:500 var(--fs-2xs)/1 var(--font-mono);border:var(--bw) solid var(--line-strong);border-bottom-width:2px;border-radius:var(--r-1);padding:2px 5px;background:var(--surface);color:var(--ink-2)}

pre.xml{margin:0;padding:14px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:var(--r-2);overflow:auto;font:12px/1.55 var(--font-mono);max-height:420px;white-space:pre;color:var(--ink-2)}

/* notificações */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px 10px 14px;border-radius:var(--r-2);font-size:var(--fs-md);z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow-float);animation:toast-in .18s var(--ease)}
.toast::before{content:"";flex:none;width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* progresso de leitura e análise (não bloqueia a interface) */
#progressPanel{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:7px;
  padding:12px 14px;background:var(--surface);border:var(--bw) solid var(--line-strong);border-radius:var(--r-2);box-shadow:var(--shadow-float);font-size:var(--fs-sm)}
#progressPanel .pg-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#progressPanel .pg-head b{font:600 var(--fs-2xs)/1.2 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-2)}
#progressPanel .pg-pct{font:600 var(--fs-md)/1 var(--font-mono);color:var(--accent)}
#progressPanel .pg-bar{position:relative;height:4px;background:var(--surface-3);overflow:hidden}
#progressPanel .pg-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .15s linear}
#progressPanel .pg-bar.indet i{width:28%;animation:pg-indet 1.2s var(--ease) infinite}
@keyframes pg-indet{from{left:-28%}to{left:100%}}
#progressPanel .pg-stage{color:var(--ink);font-weight:500}
#progressPanel .pg-detail{font:500 var(--fs-xs)/1.3 var(--font-mono)}
#progressPanel .btn{align-self:flex-end}

/* menu Projeto e diálogos de confirmação */
.pmenu{position:relative}
.pmenu-list{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:270px;display:flex;flex-direction:column;padding:4px;background:var(--surface);border:var(--bw) solid var(--line-strong);border-radius:var(--r-2);box-shadow:var(--shadow-float)}
.pmenu-list button{display:flex;align-items:center;justify-content:space-between;gap:16px;height:32px;padding:0 10px;border:0;background:none;text-align:left;cursor:pointer;font:500 var(--fs-md)/1 var(--font);color:var(--ink);border-radius:var(--r-1)}
.pmenu-list button:hover,.pmenu-list button:focus-visible{background:var(--hover)}
.pmenu-list button.danger{color:var(--p1)}

.pmenu-sep{height:var(--bw);background:var(--line);margin:4px 2px}

.linked{display:flex;flex-direction:column;gap:0}
.linked .lk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:var(--bw) solid var(--line);font-size:var(--fs-sm)}

/* sobre o COORDIX (versão e desenvolvedor, para rastreabilidade e suporte) */
.about-btn{display:grid;place-items:center;width:28px;height:28px;border:var(--bw) solid transparent;border-radius:var(--r-1);background:none;color:var(--faint);cursor:pointer}

.about-kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:4px 0 0;font-size:var(--fs-sm)}

const DEFAULT_TESTS = [
  [1,"EST","EST",0,"hard","Autodesk + BEP Penn State","Consistência estrutural"],
  [2,"EST","ARQ",5,"hard","Penn State BEP","Compatibilidade geométrica"],

  // Estrutura Metálica (MET): testes próprios, com as tolerâncias dos testes de Estrutura, editáveis em separado

  [23,"MET","EST",0,"hard","Autodesk + BEP Penn State","Interface estrutura metálica × concreto"],

].map(([ordem,a,b,tol,kind,fonte,just])=>({id:"t"+ordem,ordem,a,b,tol,kind,fonte,just,on:true}));

const DEFAULT_ENTITY_NAMES = {
  IFCPIPESEGMENT:"Segmento de tubulação", IFCPIPEFITTING:"Conexão de tubulação", IFCDUCTSEGMENT:"Segmento de duto", IFCDUCTFITTING:"Conexão de duto",
  IFCCABLECARRIERSEGMENT:"Segmento de eletrocalha", IFCCABLECARRIERFITTING:"Conexão de eletrocalha", IFCCABLESEGMENT:"Segmento de cabo", IFCCABLEFITTING:"Conexão de cabo",
  IFCFLOWSEGMENT:"Segmento de fluxo", IFCFLOWFITTING:"Conexão de fluxo", IFCFLOWTERMINAL:"Terminal de fluxo", IFCFLOWCONTROLLER:"Controlador de fluxo",
  IFCVALVE:"Válvula/registro", IFCSANITARYTERMINAL:"Aparelho sanitário", IFCWASTETERMINAL:"Terminal de esgoto", IFCLIGHTFIXTURE:"Luminária", IFCOUTLET:"Tomada",
  IFCSWITCHINGDEVICE:"Interruptor", IFCELECTRICDISTRIBUTIONBOARD:"Quadro de distribuição", IFCJUNCTIONBOX:"Caixa de passagem", IFCFIRESUPPRESSIONTERMINAL:"Terminal de combate a incêndio",
  IFCALARM:"Alarme", IFCSENSOR:"Sensor", IFCTANK:"Reservatório", IFCPUMP:"Bomba", IFCAIRTERMINAL:"Terminal de ar", IFCUNITARYEQUIPMENT:"Equipamento unitário",
  IFCWALL:"Parede", IFCWALLSTANDARDCASE:"Parede", IFCSLAB:"Laje", IFCBEAM:"Viga", IFCCOLUMN:"Pilar", IFCFOOTING:"Fundação", IFCPILE:"Estaca",
  IFCSTAIR:"Escada", IFCSTAIRFLIGHT:"Lance de escada", IFCRAMP:"Rampa", IFCRAMPFLIGHT:"Lance de rampa", IFCROOF:"Cobertura", IFCDOOR:"Porta", IFCWINDOW:"Janela",
  IFCCOVERING:"Revestimento/forro", IFCRAILING:"Guarda-corpo", IFCMEMBER:"Elemento linear", IFCPLATE:"Placa", IFCCURTAINWALL:"Fachada-cortina",
  IFCBUILDINGELEMENTPROXY:"Elemento genérico", IFCFURNISHINGELEMENT:"Mobiliário", IFCFLOWSTORAGEDEVICE:"Reservatório", IFCFLOWMOVINGDEVICE:"Equipamento de recalque",
  IFCENERGYCONVERSIONDEVICE:"Equipamento de conversão", IFCFLOWTREATMENTDEVICE:"Dispositivo de tratamento", IFCDISCRETEACCESSORY:"Acessório", IFCREINFORCINGBAR:"Armadura",
  IFCDISTRIBUTIONCONTROLELEMENT:"Elemento de controle", IFCOPENINGELEMENT:"Abertura", IFCSPACE:"Ambiente",
};
const PRETTY_WORDS=/(controller|control|segment|fitting|terminal|device|element|carrier|fixture|board|box|equipment|standard|case|flight|proxy|suppression|distribution|conversion|storage|moving|treatment|unitary|sanitary|light|cable|pipe|duct|air|waste|curtain|building|reinforcing|bar|discrete|accessory|electric|switching|junction|fire|flow|energy|opening|wall|slab|beam|column|covering|railing|member|plate|stair|ramp|roof|door|window|footing|pile|space|annotation|virtual|outlet|valve|sensor|alarm|tank|pump|furnishing|transport|chiller|boiler|transformer|generator|heat|recovery|to|quantity|property|set)/g;
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const ifcPretty = c => c ? "Ifc" + cap(c.slice(3).toLowerCase().replace(PRETTY_WORDS,cap)) : "";

const STRUCT_PRIMARY = new Set(["IFCBEAM","IFCCOLUMN","IFCFOOTING","IFCPILE","IFCMEMBER"]);
const STRUCT_SLAB = new Set(["IFCSLAB","IFCROOF"]);
const STRUCT_ALL = new Set([...STRUCT_PRIMARY,...STRUCT_SLAB,"IFCWALL","IFCWALLSTANDARDCASE"]);
const EGRESS = new Set(["IFCSTAIR","IFCSTAIRFLIGHT","IFCRAMP","IFCRAMPFLIGHT"]);
const FIRE = new Set(["IFCFIRESUPPRESSIONTERMINAL","IFCALARM"]);
const LINEAR = new Set(["IFCPIPESEGMENT","IFCDUCTSEGMENT","IFCCABLECARRIERSEGMENT","IFCCABLESEGMENT","IFCFLOWSEGMENT"]);
const FITTING = new Set(["IFCPIPEFITTING","IFCDUCTFITTING","IFCCABLECARRIERFITTING","IFCCABLEFITTING","IFCFLOWFITTING","IFCJUNCTIONBOX"]);
const EMBEDDED = new Set(["IFCOUTLET","IFCSWITCHINGDEVICE","IFCFLOWTERMINAL","IFCSANITARYTERMINAL","IFCJUNCTIONBOX","IFCELECTRICDISTRIBUTIONBOARD","IFCVALVE","IFCDOOR","IFCWINDOW"]);
const WALLS = new Set(["IFCWALL","IFCWALLSTANDARDCASE","IFCCURTAINWALL","IFCCOVERING","IFCPLATE"]);
const EQUIP = new Set(["IFCUNITARYEQUIPMENT","IFCPUMP","IFCTANK","IFCELECTRICDISTRIBUTIONBOARD","IFCFLOWMOVINGDEVICE","IFCENERGYCONVERSIONDEVICE","IFCFLOWSTORAGEDEVICE","IFCCHILLER","IFCBOILER","IFCTRANSFORMER","IFCELECTRICGENERATOR","IFCAIRTOAIRHEATRECOVERY"]);
const DEFAULT_EXCLUDED = ["IFCOPENINGELEMENT","IFCSPACE","IFCANNOTATION","IFCVIRTUALELEMENT"];

/* Regras de pré-classificação: a primeira que se aplica define a sugestão */
const RULES = [
  {id:"r_fit", cls:"FALSO", cond:"Conexão × trecho do mesmo sistema (MEP)", reason:"Sobreposição de conexão com o próprio trecho — interferência de modelagem conhecida.",
    test:(c,A,B)=>c.kind==="hard" && A.group===B.group && ((FITTING.has(A.cls)&&LINEAR.has(B.cls))||(FITTING.has(B.cls)&&LINEAR.has(A.cls))||(FITTING.has(A.cls)&&FITTING.has(B.cls))) && (!A.system||!B.system||A.system===B.system)},
  {id:"r_node", cls:"FALSO", cond:"Encontro entre peças estruturais do mesmo modelo", reason:"Nó de pórtico (viga × viga, viga × pilar, laje × viga) no mesmo arquivo de estrutura.",
    test:(c,A,B)=>A.model===B.model && isStruct(A) && STRUCT_ALL.has(A.cls) && STRUCT_ALL.has(B.cls)},
  {id:"r_emb", cls:"FALSO", cond:"Dispositivo embutido em parede/vedação", reason:"Tomada, caixa, quadro ou terminal embutido na vedação, previsto em projeto.",
    test:(c,A,B)=>(EMBEDDED.has(A.cls)&&WALLS.has(B.cls)&&B.group==="ARQ")||(EMBEDDED.has(B.cls)&&WALLS.has(A.cls)&&A.group==="ARQ")},
  {id:"r_clear", cls:"INFO", cond:"Teste de folga (clearance) sem interferência física", reason:"Folga menor que a exigida, mas os elementos não se tocam.",
    test:(c)=>c.kind==="clearance" && c.value>=0},
  {id:"r_egress", cls:"P1", cond:"Escada/rampa × qualquer elemento", reason:"Interferência em rota de fuga.",
    test:(c,A,B)=>EGRESS.has(A.cls)||EGRESS.has(B.cls)},
  {id:"r_fire", cls:"P1", cond:"Terminal de incêndio × qualquer elemento", reason:"Equipamento obstruindo sistema de combate a incêndio.",
    test:(c,A,B)=>FIRE.has(A.cls)||FIRE.has(B.cls)},
  {id:"r_beam", cls:"P1", cond:"Viga/pilar × rede MEP com espessura de interferência > 50 mm", reason:"Tubulação ou duto atravessando viga/pilar (exemplo P1 do manual).",
    test:(c,A,B)=>c.kind==="hard" && c.value>50 && ((STRUCT_PRIMARY.has(A.cls)&&isMep(B))||(STRUCT_PRIMARY.has(B.cls)&&isMep(A)))},
  {id:"r_slab", cls:"P2", cond:"Laje × rede MEP", reason:"Passagem por laje sem furo/shaft previsto — exige redefinição.",
    test:(c,A,B)=>(STRUCT_SLAB.has(A.cls)&&isMep(B))||(STRUCT_SLAB.has(B.cls)&&isMep(A))},
  {id:"r_struct", cls:"P2", cond:"Viga/pilar × rede MEP com espessura de interferência ≤ 50 mm", reason:"Interferência com estrutura — verificar possibilidade de furo com a estrutura.",
    test:(c,A,B)=>(STRUCT_PRIMARY.has(A.cls)&&isMep(B))||(STRUCT_PRIMARY.has(B.cls)&&isMep(A))},
  {id:"r_main", cls:"P2", cond:"Redes principais de disciplinas diferentes", reason:"Conflito entre redes principais — afeta mais de uma disciplina.",
    test:(c,A,B)=>LINEAR.has(A.cls)&&LINEAR.has(B.cls)&&A.code!==B.code&&mainSize(A)>60&&mainSize(B)>60},
  {id:"r_arqest", cls:"P4", cond:"Arquitetura × estrutura", reason:"Vedação encostando na estrutura — erro de modelagem sem impacto construtivo.",
    test:(c,A,B)=>(A.group==="ARQ"&&isStruct(B))||(isStruct(A)&&B.group==="ARQ")},
  {id:"r_marg", cls:"P4", cond:"Espessura de interferência até 2× a tolerância", reason:"Interferência marginal, próxima da tolerância estabelecida.",
    test:(c)=>c.kind==="hard" && c.value<=2*Math.max(c.tol,5)},
  {id:"r_light", cls:"P3", cond:"Luminária × qualquer elemento", reason:"Reposicionamento de luminária.",
    test:(c,A,B)=>A.cls==="IFCLIGHTFIXTURE"||B.cls==="IFCLIGHTFIXTURE"},
  {id:"r_sec", cls:"P3", cond:"Tubulação secundária (≤ 60 mm)", reason:"Ajuste de tubulação secundária — correção pontual.",
    test:(c,A,B)=>(LINEAR.has(A.cls)&&mainSize(A)<=60)||(LINEAR.has(B.cls)&&mainSize(B)<=60)},
  {id:"r_wall", cls:"P3", cond:"Rede MEP × alvenaria", reason:"Passagem por alvenaria — furo pontual.",
    test:(c,A,B)=>(isMep(A)&&WALLS.has(B.cls))||(isMep(B)&&WALLS.has(A.cls))},

let WEBIFC=null, api=null, engineError=null;

// círculos com 24 segmentos (padrão do leitor: 12). Polígono inscrito: com 12 lados um tubo Ø100 perde até

async function initEngine(){
  try{
    // leitor IFC: web-ifc 0.0.78 (lê IFC2X3, IFC4 e IFC4X3; geometria de curvas, varreduras e conexões
    // muito mais robusta que a 0.0.39). API e .wasm da MESMA versão; no desktop, servidos por cópia local.
    WEBIFC = await import(`${WEBIFC_BASE}web-ifc-api.js`);
    for(const [k,v] of Object.entries(WEBIFC)) if(/^IFC[A-Z0-9_]+$/.test(k)&&typeof v==="number") TYPE_NAME[v]=k;
    api = new WEBIFC.IfcAPI();
    api.SetWasmPath(WEBIFC_BASE,true);
    await api.Init((path)=> path.endsWith(".wasm") ? WEBIFC_BASE+"web-ifc.wasm" : path, true);
    setStatus("Motor IFC pronto.");
  }catch(e){
    engineError=e; console.error(e);
    setStatus("Motor IFC indisponível");
    setViewerMsg("O motor de leitura IFC não carregou neste navegador ("+esc(e.message||e)+"). A interface continua navegável; recarregue a página para tentar de novo.");
  }
}

  V.renderer.domElement.addEventListener("pointerup",e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5) pick(e);down=null});
  el.querySelector(".vtools").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");if(!b) return;

function updateViewerTheme(){
  if(!V.scene) return;
  const cs=getComputedStyle(document.documentElement),tok=(k,d)=>cs.getPropertyValue(k).trim()||d;
  V.scene.background=new THREE.Color(tok("--viewer","#d7dbe1"));
  // a grade usa as cores do ambiente 3D, não as da interface; posição e escala são preservadas
  for(const g of [...V.grid.children]){V.grid.remove(g);g.geometry.dispose();g.material.dispose()}
  const minor=new THREE.GridHelper(200,200,tok("--viewer-grid","#b9c0c9"),tok("--viewer-grid","#b9c0c9"));

/* Origem local do PROJETO (metros, eixo Y para cima): subtraída de todas as coordenadas dos IFCs do projeto,
   preservando a posição relativa entre eles. Definida pelo 1º modelo lido com sucesso (centro robusto: mediana
   dos centros dos elementos, imune a elementos isolados na origem) e guardada no projeto. A análise usa Float64
   relativo a esta origem; o desenho usa Float32 relativo ao centro de cada malha (sem perda de precisão). */
function projOffset(pid){const P=DB.projects.find(p=>p.id===pid);return P&&Array.isArray(P.origemLocal)?P.origemLocal:null}
const median=a=>{if(!a.length) return 0;const s=Float64Array.from(a).sort();const h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
async function loadIfc(projectId, file, bytes, origem){
  const list=S.models[projectId]||(S.models[projectId]=[]);
  const code=codeFromFile(file);
  const m={id:uid(),projectId,file,code,disc:(CODE_INFO[code]||["A definir"])[0],group:(CODE_INFO[code]||[null,null])[1],
    status:"lendo",progress:0,elems:[],chunks:[],storeys:[],building:"",visible:true,error:null,size:bytes.byteLength,
    caminho:origem&&origem.caminho||null,sha256:origem&&origem.sha256||null};
  list.push(m);renderAll();
  if(!m.sha256) m.sha256=await sha256Hex(bytes); // assinatura do arquivo: o projeto reconhece o mesmo IFC ao reabrir
  if(engineError||!api){m.status="erro";m.error="Motor IFC indisponível";renderAll();return m}
  await new Promise(r=>setTimeout(r,30));
  try{
    try{const head=new TextDecoder().decode(new Uint8Array(bytes,0,Math.min(4000,bytes.byteLength)));const mm=head.match(/FILE_SCHEMA\s*\(\s*\(\s*'([^']+)'/i);m.schema=mm?mm[1]:""}catch(e){}
    m.stage="abertura do arquivo";
    await loadStage(`Abrindo ${file} (leitura do IFC)`);
    const mid=api.OpenModel(new Uint8Array(bytes),IFC_LOADER_SETTINGS);
    bytes=null; // o leitor já copiou o arquivo: libera o original (arquivos grandes)
    if(mid<0) throw new Error("o leitor IFC não conseguiu abrir o arquivo");
    m.mid=mid;
    await loadStage("Lendo pavimentos, PropertySets, tipos e sistemas");
    indexModel(m);
    m.progress=.25;renderModelsProgress();
    await loadStage("Gerando a geometria 3D dos elementos");
    buildGeometry(m);
    m.status="pronto";m.progress=1;
    progress.detail(`${m.elems.length.toLocaleString("pt-BR")} elementos com geometria em ${file}`);
    await loadStage("Montando a visualização");
    if(projectId===DB.current){attachModel(m);setViewerMsg("")}
    renderAll();
    if(projectId===DB.current && list.filter(x=>x.status==="pronto").length===1) fitView();
    linkModelRef(projectId,m);
  }catch(e){console.error(e);m.status="erro";m.error=`${ifcErrorText(e)} — na etapa "${m.stage||"abertura do arquivo"}"${m.schema?" · esquema "+m.schema:""}`;renderAll();
    toast(`Não foi possível ler ${file}: ${m.error}`)}
  return m;
}

function indexModel(m){
  const mid=m.mid,T=WEBIFC;
  m.skipped=m.skipped||{};
  const skip=(what,e)=>{m.skipped[what]=(m.skipped[what]||0)+1;if(m.skipped[what]===1) console.warn("COORDIX: "+what+" ignorado",e)};
  const ids=code=>{if(code==null) return [];try{return vec(api.GetLineIDsWithType(mid,code))}catch(e){skip("tipo "+code,e);return []}};
  const line=id=>api.GetLine(mid,id,false);
  const each=(code,label,fn)=>{for(const id of ids(code)){try{const l=line(id);if(l) fn(l,id)}catch(e){skip(label,e)}}};
  const refs=a=>Array.isArray(a)?a:(a==null?[]:[a]);
  m.containedIn={};m.aggParent={};m.psetsOf={};m.typeOf={};m.systemOf={};m.layerOfRep={};m.storeyInfo={};
  m.stage="relações espaciais";
  each(T.IFCRELCONTAINEDINSPATIALSTRUCTURE,"IfcRelContainedInSpatialStructure",l=>{const st=val(l.RelatingStructure);for(const r of refs(l.RelatedElements)) m.containedIn[val(r)]=st});
  each(T.IFCRELAGGREGATES,"IfcRelAggregates",l=>{const p=val(l.RelatingObject);for(const r of refs(l.RelatedObjects)) m.aggParent[val(r)]=p});
  m.stage="PropertySets";
  each(T.IFCRELDEFINESBYPROPERTIES,"IfcRelDefinesByProperties",l=>{const pd=val(l.RelatingPropertyDefinition);for(const r of refs(l.RelatedObjects)){const k=val(r);(m.psetsOf[k]||(m.psetsOf[k]=[])).push(pd)}});
  m.stage="tipos";
  each(T.IFCRELDEFINESBYTYPE,"IfcRelDefinesByType",l=>{const t=val(l.RelatingType);for(const r of refs(l.RelatedObjects)) m.typeOf[val(r)]=t});
  m.stage="sistemas";
  each(T.IFCRELASSIGNSTOGROUP,"IfcRelAssignsToGroup",l=>{
    const g=val(l.RelatingGroup);let gl;try{gl=line(g)}catch(e){return}
    const tn=TYPE_NAME[gl.type]||"";if(!/SYSTEM/.test(tn)) return;
    for(const r of refs(l.RelatedObjects)) m.systemOf[val(r)]=decIfc(val(gl.Name))||"";
  });
  m.stage="layers";
  each(T.IFCPRESENTATIONLAYERASSIGNMENT,"IfcPresentationLayerAssignment",l=>{const n=decIfc(val(l.Name));for(const r of refs(l.AssignedItems)) m.layerOfRep[val(r)]=n});
  m.stage="pavimentos";
  each(T.IFCBUILDINGSTOREY,"IfcBuildingStorey",(l,id)=>{m.storeyInfo[id]={name:decIfc(val(l.Name))||("Pavimento #"+id),elev:Number(val(l.Elevation))||0}});
  m.storeys=Object.values(m.storeyInfo).sort((a,b)=>a.elev-b.elev);
  each(T.IFCBUILDING,"IfcBuilding",l=>{if(!m.building) m.building=decIfc(val(l.Name))||""});
  m.stage="unidades";
  m.unitScale=1;
  // unidade de comprimento DECLARADA: IfcProject.UnitsInContext → IfcUnitAssignment.Units
  // Unidades: no web-ifc 0.0.39 os atributos de IfcSIUnit chegam deslocados (UnitType vazio,
  // Prefix = "LENGTHUNIT", Name = "MILLI"). A leitura identifica cada campo pelo VALOR, sem depender
  // da posição: termina em UNIT → tipo; prefixo SI → prefixo; METRE/… → nome.
  const SI_PREFIXES=["EXA","PETA","TERA","GIGA","MEGA","KILO","HECTO","DECA","DECI","CENTI","MILLI","MICRO","NANO","PICO","FEMTO","ATTO"];
  const enumsOf=(l)=>Object.keys(l).filter(k=>k!=="type"&&k!=="expressID").map(k=>val(l[k])).filter(v=>typeof v==="string");
  const plainSI=(l)=>{const e=enumsOf(l);return {type:TYPE_NAME[l.type]||"",UnitType:e.find(v=>/UNIT$/.test(v)),Prefix:e.find(v=>SI_PREFIXES.includes(v))||"",Name:e.find(v=>!/UNIT$/.test(v)&&!SI_PREFIXES.includes(v))}};
  const plainUnit=(id)=>{let l;try{l=line(id)}catch(e){return null}
    const tn=TYPE_NAME[l.type]||"";
    if(tn==="IFCSIUNIT") return plainSI(l);
    if(tn==="IFCCONVERSIONBASEDUNIT"){const e=enumsOf(l);const o={type:tn,UnitType:e.find(v=>/UNIT$/.test(v)),Name:decIfc(e.find(v=>!/UNIT$/.test(v))||""),ConversionFactor:{}};
      try{const ref=Object.keys(l).map(k=>l[k]).find(v=>v&&typeof v==="object"&&v.type===5&&(TYPE_NAME[line(v.value).type]||"")==="IFCMEASUREWITHUNIT");
        const cf=line(ref.value);const keys=Object.keys(cf).filter(k=>k!=="type"&&k!=="expressID");
        const num=keys.map(k=>cf[k]).map(v=>val(v)).find(v=>typeof v==="number");
        const ucRef=keys.map(k=>cf[k]).find(v=>v&&typeof v==="object"&&v.type===5);
        o.ConversionFactor={ValueComponent:Number(num),UnitComponent:ucRef?plainSI(line(ucRef.value)):{}}}catch(e){}
      return o}
    return {type:tn,UnitType:enumsOf(l).find(v=>/UNIT$/.test(v))};
  };
  const units=[];
  for(const pid of ids(T.IFCPROJECT)){try{const pl=line(pid);const ua=val(pl.UnitsInContext);if(ua==null) continue;
    const al=line(ua);for(const u of al.Units||[]){const o=plainUnit(val(u));if(o) units.push(o)}}catch(e){skip("IfcUnitAssignment",e)}}
  m.lengthUnit=GEOC.resolveLengthUnit(units);
  // referência independente para verificar se o leitor converteu a geometria: maior profundidade de extrusão
  m.maxExtrusionDepth=0;
  {let n=0;for(const id of ids(T.IFCEXTRUDEDAREASOLID)){if(++n>5000) break;try{const d=Number(val(line(id).Depth));if(d>m.maxExtrusionDepth) m.maxExtrusionDepth=d}catch(e){}}}
}
function storeyOf(m,eid){
  let cur=eid;for(let i=0;i<12&&cur!=null;i++){
    if(m.storeyInfo[cur]) return m.storeyInfo[cur].name;
    if(m.containedIn[cur]!=null){const s=m.containedIn[cur];if(m.storeyInfo[s]) return m.storeyInfo[s].name;cur=s;continue}
    cur=m.aggParent[cur];
  }
  return "Sem pavimento";
}

function buildGeometry(m){
  const mid=m.mid,T=WEBIFC;
  const ids=code=>code==null?[]:vec(api.GetLineIDsWithType(mid,code));
  const perEl=new Map(); // eid → {geoms:[{p,n,i,color}]}
  let origin=null;const cx=[],cy=[],cz=[]; // centros dos elementos (para a origem robusta)
  let rawMin=[Infinity,Infinity,Infinity],rawMax=[-Infinity,-Infinity,-Infinity];
  m.stage="geometria";
  m.geoFailures=[];m.unprocessed=[];
  const reader={
    getGeometry:(pg)=>api.GetGeometry(mid,pg.geometryExpressID),
    getVertices:(g)=>api.GetVertexArray(g.GetVertexData(),g.GetVertexDataSize()),
    getIndices:(g)=>api.GetIndexArray(g.GetIndexData(),g.GetIndexDataSize()),
    release:(g)=>{if(g&&g.delete) g.delete()},
    transform:(pg)=>pg.flatTransformation,
  };
  api.StreamAllMeshes(mid,(fm)=>{
    const eid=fm.expressID;
    let refs=[];
    try{const gs=fm.geometries;const n=gs.size();for(let gi=0;gi<n;gi++) refs.push(gs.get(gi))}
    catch(e){m.unprocessed.push({eid,reason:"falha ao listar as representações: "+(e.message||e)});return}
    const r=GEOC.readElementGeometries(refs,reader); // cada falha é registrada; recursos liberados em finally
    for(const f of r.failures) m.geoFailures.push({eid,geometryExpressID:f.ref&&f.ref.geometryExpressID,stage:f.stage,reason:f.reason});
    if(!r.geoms.length){m.unprocessed.push({eid,reason:r.failures.map(f=>`${f.stage}: ${f.reason}`).join("; ")||"sem representação"});return}
    let ex0=Infinity,ey0=Infinity,ez0=Infinity,ex1=-Infinity,ey1=-Infinity,ez1=-Infinity;
    for(const g of r.geoms){
      const c=g.ref.color;g.c=[c.x,c.y,c.z,c.w];delete g.ref;

/* desenho "relativo ao centro": vértices em Float32 relativos ao centro da malha; o centro fica na posição do

function subsetMesh(idxs,color,{offset=0,useOwn=false}={}){
  let nv=0,ni=0;for(const i of idxs) for(const g of ELEMS[i].geoms){nv+=g.p64.length/3;ni+=g.i.length}
  const ctr=partsCenter(idxs.flatMap(i=>ELEMS[i].geoms));
  const P=new Float32Array(nv*3),N=new Float32Array(nv*3),E=new Float32Array(nv),C=useOwn?new Float32Array(nv*3):null,I=new Uint32Array(ni);let vo=0,io=0;
  for(const i of idxs) for(const g of ELEMS[i].geoms){const n=g.p64.length/3;writeRel(P,vo*3,g.p64,ctr);N.set(g.n,vo*3);E.fill(i,vo,vo+n);
    if(C) for(let k=0;k<n;k++){C[(vo+k)*3]=g.c[0];C[(vo+k)*3+1]=g.c[1];C[(vo+k)*3+2]=g.c[2]}
    for(let k=0;k<g.i.length;k++) I[io+k]=g.i[k]+vo;vo+=n;io+=g.i.length}
  const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(P,3));geo.setAttribute("normal",new THREE.BufferAttribute(N,3));
  geo.setAttribute("eid",new THREE.BufferAttribute(E,1));if(C) geo.setAttribute("color",new THREE.BufferAttribute(C,3));geo.setIndex(new THREE.BufferAttribute(I,1));
  const mat=new THREE.MeshLambertMaterial({color:useOwn?0xffffff:color,vertexColors:useOwn,side:THREE.DoubleSide,polygonOffset:offset!==0,polygonOffsetFactor:offset,polygonOffsetUnits:offset*4});
  const mesh=new THREE.Mesh(geo,mat);mesh.position.set(ctr[0],ctr[1],ctr[2]);return mesh;

/* diagnóstico somente leitura (usado pelo teste de fumaça): origem do projeto e maior coordenada dos vértices desenhados */
window.coordixDiagnostico=()=>{let vMax=0,pMax=0;for(const c of V.root.children){const a=c.geometry&&c.geometry.attributes.position;if(!a) continue;
  for(let k=0;k<a.array.length;k++){const v=Math.abs(a.array[k]);if(v>vMax)vMax=v}pMax=Math.max(pMax,Math.abs(c.position.x),Math.abs(c.position.y),Math.abs(c.position.z))}

function fitView(box){
  if(!box){box=new THREE.Box3();for(const c of V.root.children) if(c.visible) box.expandByObject(c)} // caixa no mundo (malhas relativas ao centro)
  if(box.isEmpty()) return;
  const c=box.getCenter(new THREE.Vector3()),r=Math.max(box.getSize(new THREE.Vector3()).length()/2,0.6);
  const dir=V.camera.position.clone().sub(V.controls.target).normalize();if(dir.lengthSq()<.5) dir.set(1,.8,1).normalize();
  const dist=r/Math.sin(THREE.MathUtils.degToRad(V.camera.fov/2))*1.1;
  V.controls.target.copy(c);V.camera.position.copy(c.clone().add(dir.multiplyScalar(dist)));
  V.camera.near=Math.max(dist/2000,0.01);V.camera.far=dist*200;V.camera.updateProjectionMatrix();

function pick(e){
  const r=V.renderer.domElement.getBoundingClientRect();
  const mouse=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster();rc.setFromCamera(mouse,V.camera);
  const targets=V.iso.children.length?[...V.iso.children,...(V.ghost?[]:V.root.children.filter(c=>c.visible))]:V.root.children.filter(c=>c.visible);
  const hits=rc.intersectObjects(targets,false);

  const h=hits[0];const idx=h.object.geometry.attributes.eid.getX(h.face.a);

/* --- propriedades --- */
function psetsOf(el){
  if(el._psets) return el._psets;
  const m=el.m,out=[];
  const read=(id,fromType)=>{
    let l;try{l=api.GetLine(m.mid,id,true)}catch(e){return}
    const tn=TYPE_NAME[l.type]||"";
    const name=decIfc(val(l.Name))||tn;
    const props=[];
    if(tn==="IFCPROPERTYSET"){
      for(const p of l.HasProperties||[]){
        const pn=decIfc(val(p.Name));let v=null;
        if(p.NominalValue!==undefined) v=val(p.NominalValue);
        else if(p.EnumerationValues) v=(p.EnumerationValues||[]).map(val).join(", ");
        else if(p.ListValues) v=(p.ListValues||[]).map(val).join(", ");
        else if(p.UpperBoundValue||p.LowerBoundValue) v=[val(p.LowerBoundValue),val(p.UpperBoundValue)].filter(x=>x!=null).join(" – ");
        props.push([pn,fmtVal(v)]);
      }
    }else if(tn==="IFCELEMENTQUANTITY"){
      for(const q of l.Quantities||[]){
        const v=val(q.LengthValue??q.AreaValue??q.VolumeValue??q.CountValue??q.WeightValue??q.TimeValue);
        props.push([decIfc(val(q.Name)),fmtVal(v)]);
      }
    }else return;
    out.push({name,props,fromType,qto:tn==="IFCELEMENTQUANTITY"});
  };
  for(const id of m.psetsOf[el.eid]||[]) read(id,false);
  const t=m.typeOf[el.eid];
  if(t!=null){try{const tl=api.GetLine(m.mid,t,false);for(const r of tl.HasPropertySets||[]) read(val(r),true)}catch(e){}}
  el._psets=out;return out;
}
function fmtVal(v){
  if(v==null) return "";
  if(v==="T"||v===true) return "Sim"; if(v==="F"||v===false) return "Não";
  if(typeof v==="number") return Math.abs(v)>=1e-4||v===0?String(Math.round(v*10000)/10000).replace(".",","):String(v);

}
function layerOf(el){

function inGroup(el,g){
  if(g==="FORRO") return el.cls==="IFCCOVERING";

function propMap(el){
  if(el._pm) return el._pm;const pm={};for(const ps of psetsOf(el)){const o=pm[ps.name]||(pm[ps.name]={});for(const [k,v] of ps.props) o[k]=v}

function excludedBy(el,P){
  if(P.excluded.includes(el.cls)) return "Entidade excluída: "+entityName(el.cls);
  for(const f of P.filters){
    if(!f.on) continue;
    if(f.kind==="entity"){if(el.cls===f.cls) return "Filtro de entidade: "+entityName(f.cls);continue}
    const pm=propMap(el);const ps=pm[f.pset];const v=ps?ps[f.prop]:undefined;
    const want=String(f.value??"").trim().toLowerCase(),have=v==null?null:String(v).trim().toLowerCase();
    let hit=false;
    if(f.op==="existe") hit=v!==undefined;
    else if(f.op==="=") hit=have!==null&&have===want;
    else if(f.op==="≠") hit=have!==null&&have!==want;
    else if(f.op==="contém") hit=have!==null&&have.includes(want);
    if(hit) return `Filtro: ${f.pset}.${f.prop} ${f.op} ${f.value??""}`.trim();
  }

async function runAnalysis(){
  const P=proj();const models=(S.models[P.id]||[]).filter(m=>m.status==="pronto");
  if(!models.length){toast("Carregue ao menos um modelo IFC.");return}
  if(AN.running){toast("Já existe uma análise em andamento.");return}
  const t0=performance.now();
  const all=models.flatMap(m=>m.elems.map(i=>ELEMS[i]));
  const excluded=[];const pool=[];
  for(const el of all){const why=excludedBy(el,P);if(why) excluded.push({el,why});else pool.push(el)}
  const found=new Map();
  const tests=P.tests.filter(t=>t.on).sort((a,b)=>a.ordem-b.ordem);
  let below=0,rejected=0,nNarrow=0;const checked=new Set(),geoStats={},jobs=[];
  for(const t of tests){
    const A=pool.filter(e=>inGroup(e,t.a)),B=pool.filter(e=>inGroup(e,t.b));
    if(!A.length||!B.length) continue;
    const tol=t.tol/1000,same=t.a===t.b;
    const pad=t.kind==="clearance"?tol:0;
    const Bs=[...B].sort((x,y)=>x.box.min.x-y.box.min.x);
    for(const a of A){
      const ax0=a.box.min.x-pad,ax1=a.box.max.x+pad;
      for(let j=0;j<Bs.length;j++){
        const b=Bs[j];if(b.box.min.x>ax1) break;if(b.box.max.x<ax0) continue;
        if(a===b) continue;if(same&&a.idx>b.idx&&inGroup(b,t.a)&&inGroup(a,t.b)) continue;
        const ox=Math.min(a.box.max.x,b.box.max.x)-Math.max(a.box.min.x,b.box.min.x);
        const oy=Math.min(a.box.max.y,b.box.max.y)-Math.max(a.box.min.y,b.box.min.y);
        const oz=Math.min(a.box.max.z,b.box.max.z)-Math.max(a.box.min.z,b.box.min.z);
        if(ox<-pad||oy<-pad||oz<-pad) continue;
        if(t.kind==="hard"&&(ox<=0||oy<=0||oz<=0)) continue;
        const key=a.idx<b.idx?a.idx+"|"+b.idx:b.idx+"|"+a.idx; // por índice: GUIDs repetidos não somem da análise
        if(checked.has(key+"|"+t.id)) continue;

      }
    }
  }

  // mesmos pares, mesma ordem, mesmo núcleo e mesmas opções — volume: calculado ao abrir o clash
  let results;
  try{results=await evaluatePairs(jobs,{elements:all.length,pool:pool.length})}
  catch(e){

    console.error(e);toast(`A análise foi interrompida: ${(e&&e.message)||e}. Os resultados anteriores foram mantidos.`);return;
  }
  for(let ji=0;ji<jobs.length;ji++){
    const {a,b,t,key}=jobs[ji];let r=results[ji];
        if(r&&r.erro!==undefined) r=failedPair(r.erro); // falha interna no par: nunca vira "sem conflito"
        // unidade não confirmada: a escala é desconhecida, então nenhuma comparação com a tolerância vale
        if((a.m.unitUnsupported||b.m.unitUnsupported)&&r.state!=="incompleto"){r.state="inconclusivo";r.metricQuality="indisponivel";r.flags.push("unidade_nao_suportada")}
        geoStats[r.state]=(geoStats[r.state]||0)+1;
        if(r.state==="sem_conflito"||r.state==="contato"){if(t.kind==="hard") rejected++;continue}
        if(r.state==="abaixo_tolerancia"){below++;continue}
        // confirmado, inconclusivo e incompleto entram na lista: nunca são tratados como ausência de conflito
        const value=r.value==null?null:Math.round(r.value*1e4)/10;
        const item={id:key,key:pairKey(a,b),a:a.idx,b:b.idx,test:t.id,testName:`${GROUPS[t.a]} × ${GROUPS[t.b]}`,kind:t.kind,tol:t.tol,value,center:r.center,
          geo:{state:r.state,lb:r.lb,ub:r.ub,volume:r.volume,extent:r.extent,quality:r.quality,flags:r.flags,method:r.method,metricQuality:r.metricQuality,evidence:r.evidence,bounds:r.bounds}};
        // consolidação: o mesmo par em vários testes mantém o resultado mais relevante e confiável
        // (confirmado > inconclusivo/incompleto); um inconclusivo nunca é trocado por ausência
        const prev=found.get(key);
        if(prev){const rank=x=>x.geo.state==="confirmado"?2:1;const keep=rank(item)>rank(prev)?item:prev,other=keep===item?prev:item;
          keep.geo.otherTests=[...(keep.geo.otherTests||[]),...(other.geo.otherTests||[]),{testName:other.testName,state:other.geo.state,tol:other.tol}];found.set(key,keep);continue}
        found.set(key,item);
  }
  const list=[...found.values()];
  for(const c of list){prepareClash(c,P)}
  list.sort((x,y)=>levelRank(x.level)-levelRank(y.level)||CLS_ORDER.indexOf(x.cls)-CLS_ORDER.indexOf(y.cls));
  S.clashes[P.id]=list;
  S.lastRun[P.id]={date:new Date().toISOString(),ms:Math.round(performance.now()-t0),elements:all.length,pool:pool.length,excluded,below,rejected,narrow:nNarrow,tests:tests.length,geo:geoStats,
    missing:models.filter(m=>(m.unprocessed||[]).length).map(m=>({file:m.file,n:m.unprocessed.length,items:m.unprocessed.slice(0,200)})),
    partial:pool.filter(e=>e.geoIntegrity==="parcial").map(e=>({file:e.m.file,guid:e.guid,eid:e.eid,cls:e.cls,failures:e.geoFailures})),
    topology:topologyStats(pool),unitIssues:models.filter(m=>m.unitUnsupported).map(m=>m.file)};
  // histórico de análises do projeto (persistido)
  const lr=S.lastRun[P.id];
  P.runLog=[...(P.runLog||[]),{date:lr.date,tests:lr.tests,pairs:nNarrow,listed:list.length,geo:geoStats,partial:lr.partial.length,missing:lr.missing.reduce((s,x)=>s+x.n,0),topology:lr.topology}].slice(-20);save();
  renderAll();
  const pend=list.filter(c=>c.state!=="validado").length;
  const doubt=(geoStats.inconclusivo||0)+(geoStats.incompleto||0);
  toast(`${list.length} clashes encontrados · ${pend} aguardando sua revisão${doubt?` · ${doubt} com resultado geométrico a verificar`:""}.`);
}
/* ---------- análise em segundo plano: Web Worker, progresso e cancelamento ---------- */
const AN={worker:null,sent:new Set(),running:null,exec:0};
function failedPair(msg){
  return {state:"inconclusivo",value:null,lb:null,ub:null,volume:null,extent:null,quality:"indisponivel",metricQuality:"indisponivel",
    flags:["falha_avaliacao"],method:"erro",evidence:"falha ao avaliar: "+msg,bounds:null,center:null};
}
function analysisWorker(){
  if(AN.worker) return AN.worker;
  try{AN.worker=new Worker("coordix-analise-worker.js");AN.sent=new Set()}catch(e){console.warn("COORDIX: Web Worker indisponível; análise na linha principal",e);AN.worker=null}
  return AN.worker;
}
function resetAnalysisWorker(){if(AN.worker){AN.worker.terminate();AN.worker=null}AN.sent=new Set()}
function forgetAnalysisMeshes(idxs){if(AN.worker){AN.worker.postMessage({tipo:"descartar",idx:idxs});for(const i of idxs) AN.sent.delete(i)}}
const STAGE_LABEL={pares:"Selecionando pares candidatos",malhas:"Preparando malhas (topologia e índice espacial)",avaliar:"Avaliando a geometria dos pares",consolidar:"Consolidando e pré-classificando"};
function evaluatePairs(jobs,info){
  const total=jobs.length;
  return new Promise((resolve,reject)=>{
    const exec=++AN.exec;let done=false;
    const finish=(fn,v)=>{if(done) return;done=true;AN.running=null;fn(v)};
    const cancel=()=>{resetAnalysisWorker();progress.hide();finish(reject,{cancelado:true})};
    AN.running={exec,cancel};
    progress.show({title:"Análise de interferências",stage:STAGE_LABEL.pares,detail:`${info.pool} de ${info.elements} elementos entram na análise · ${total} pares candidatos`,onCancel:cancel});
    if(!total){progress.hide();finish(resolve,[]);return}
    const w=analysisWorker();
    if(!w){ // sem Worker: mesma avaliação na linha principal, em lotes, com progresso e cancelamento
      const out=new Array(total);let k=0;
      const step=()=>{
        if(done) return;
        const t1=performance.now();
        while(k<total&&performance.now()-t1<40){const j=jobs[k];
          try{out[k]=GEOC.evaluatePair(solidOf(j.a),solidOf(j.b),{kind:j.t.kind,tol:j.tol,volume:false})}catch(e){out[k]={erro:String(e.message||e)}}k++}
        progress.update({stage:STAGE_LABEL.avaliar,done:k,total,unit:"pares"});
        if(k<total) setTimeout(step,0); else {progress.hide();finish(resolve,out)}
      };
      setTimeout(step,30);return;
    }
    // envia ao worker só as malhas que ele ainda não tem (Float64, a mesma geometria da análise)
    const need=[],seen=new Set();
    for(const j of jobs) for(const el of [j.a,j.b]) if(!AN.sent.has(el.idx)&&!seen.has(el.idx)){seen.add(el.idx);need.push(el)}
    for(let i=0;i<need.length;i+=200){
      const itens=need.slice(i,i+200).map(el=>({idx:el.idx,incomplete:el.geoIntegrity!=="completa",geoms:el.geoms.map(g=>({p64:g.p64,i:g.i}))}));
      w.postMessage({tipo:"malhas",itens});for(const el of need.slice(i,i+200)) AN.sent.add(el.idx);
    }
    w.onmessage=ev=>{
      const m=ev.data;if(m.execucao!==exec||done) return;
      if(m.tipo==="progresso") progress.update({stage:STAGE_LABEL[m.etapa==="malhas"?"malhas":"avaliar"],done:m.feitos,total:m.total,unit:m.etapa==="malhas"?"elementos":"pares"});
      else if(m.tipo==="resultado"){
        for(const [idx,tp] of Object.entries(m.topologias||{})){const el=ELEMS[+idx];if(el&&tp) el._topo=tp}
        progress.update({stage:STAGE_LABEL.consolidar,done:null,total:null});
        setTimeout(()=>{progress.hide();finish(resolve,m.resultados)},0);
      }
      else if(m.tipo==="falha"){progress.hide();finish(reject,new Error(m.mensagem))}
    };
    w.onerror=ev=>{ev.preventDefault();const msg=ev.message||"erro no processamento em segundo plano";resetAnalysisWorker();progress.hide();
      finish(reject,new Error(/memory|memória|allocation/i.test(msg)?"memória insuficiente para os modelos carregados":msg))};
    w.postMessage({tipo:"avaliar",execucao:exec,pares:jobs.map(j=>({a:j.a.idx,b:j.b.idx,kind:j.t.kind,tol:j.tol}))});
  });
}

function topologyStats(pool){

function levelOrder(){
  const P=proj();const ms=(S.models[P.id]||[]).filter(m=>m.storeys);
  const map=new Map();for(const m of ms) for(const s of m.storeys) if(!map.has(s.name)||map.get(s.name)>s.elev*(m.lengthScale||1)) map.set(s.name,s.elev*(m.lengthScale||1));

/* ---------- 1. Projeto e equipe ---------- */

  const real=cl.filter(c=>c.cls!=="FALSO");const tot=real.length;

  return `<section class="view stack">
    <div><h1>${esc(P.name)}</h1><p class="lede">${P.example?"Projeto de exemplo carregado com modelos IFC fictícios. Crie um projeto novo para trabalhar com os seus IFCs.":"Cadastre a equipe e envie os modelos IFC de cada disciplina."}</p></div>

      <div class="panel stack">

      </div>
      <div class="panel stack">
        <h2>Situação da coordenação</h2>
        <div class="row" style="gap:24px">
          <div><div class="muted" style="font-size:12px">Modelos</div><div style="font:600 22px var(--font-cond)" class="num">${ms.filter(m=>m.status==="pronto").length}</div></div>
          <div><div class="muted" style="font-size:12px">Elementos</div><div style="font:600 22px var(--font-cond)" class="num">${fmt(nEl)}</div></div>
          <div><div class="muted" style="font-size:12px">Clashes reais</div><div style="font:600 22px var(--font-cond)" class="num">${tot}</div></div>
          <div><div class="muted" style="font-size:12px">Falsos clashes</div><div style="font:600 22px var(--font-cond)" class="num">${cl.length-tot}</div></div>
          <div title="KPI 1 do manual: resolvidos ÷ identificados"><div class="muted" style="font-size:12px">TRC</div><div style="font:600 22px var(--font-cond)" class="num">${issues.length?fmt(resolved/issues.length*100)+"%":"—"}</div></div>
        </div>

          ${tot?`<div class="sevbar">${dist.map(([k,n])=>n?`<span style="width:${n/tot*100}%;background:var(--${k.toLowerCase()})" title="${CLASSES[k].label}: ${n}"></span>`:"").join("")}</div>
          <div class="row" style="gap:10px;margin-top:8px;font-size:12px">${dist.map(([k,n])=>`<span><span class="chip ${k}">${k}</span> <span class="num">${n} · ${fmt(n/tot*100)}%</span></span>`).join("")}</div>`:`<div class="muted" style="font-size:13px">Rode a análise de clashes para ver a distribuição.</div>`}

        <tbody>${P.team.map(m=>`<tr data-mid="${m.id}">
          <td><input type="text" data-f="name" value="${esc(m.name)}" aria-label="Nome"></td>
          <td><input type="text" data-f="role" value="${esc(m.role)}" aria-label="Cargo"></td>
          <td><input type="text" data-f="codes" value="${esc(m.codes)}" placeholder="ex.: SAN, PCI" aria-label="Disciplinas"></td>
          <td><input type="email" data-f="email" value="${esc(m.email)}" aria-label="E-mail"></td>
          <td class="tight"><input type="radio" name="coord" data-f="coord" ${m.coord?"checked":""} aria-label="Coordenador"></td>
          <td class="tight"><button class="btn small ghost" data-del-member="${m.id}" aria-label="Remover">Remover</button></td></tr>`).join("")}</tbody>
      </table></div>
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">O responsável de cada clash é sugerido pelo código de disciplina do modelo que deve se adaptar (ordem de flexibilidade em Regras). </p>

/* ---------- 2. Modelos ---------- */
function viewModelos(){
  const P=proj();const ms=S.models[P.id]||[];
  const discOpts=(cur)=>Object.entries(CODE_INFO).map(([k,v])=>`<option value="${k}" ${k===cur?"selected":""}>${k} — ${esc(v[0])}</option>`).join("")+`<option value="" ${!cur?"selected":""}>A definir</option>`;
  return `<section class="view stack">
    <div><h1>Modelos IFC</h1><p class="lede">Envie um arquivo por disciplina. A disciplina é lida do código no nome do arquivo (ex.: PROJ-<b>SAN</b>-R00.ifc) e pode ser ajustada.</p></div>

        <thead><tr><th>Arquivo</th><th>Disciplina</th><th>Elementos</th><th>Pavimentos</th><th>Situação</th><th>Visível</th><th></th></tr></thead>
        <tbody>${ms.map(m=>`<tr data-model="${m.id}">
          <td><div style="font-weight:500">${esc(m.file)}</div><div class="muted mono">${fmt(m.size/1024)} kB${P.example?" · exemplo":""}</div></td>

          <td class="tight"><input type="checkbox" data-vis="${m.id}" ${m.visible?"checked":""} aria-label="Visível"></td>
          <td class="tight"><button class="btn small ghost" data-rm-model="${m.id}">Remover</button></td></tr>`).join("")}</tbody></table></div>`

function renderTree(){

  if(!ms.length){host.innerHTML=`<div class="empty" style="margin:12px">Nenhum modelo carregado. <button class="btn small" data-nav="modelos" style="margin-top:8px">Enviar IFC</button></div>`;return}
  const open=S.ui.treeOpen;
  host.innerHTML=`<ul class="tree">${ms.map(m=>{
    const byStorey=new Map();for(const i of m.elems){const e=ELEMS[i];const s=byStorey.get(e.storey)||new Map();const k=e.cls;s.set(k,[...(s.get(k)||[]),i]);byStorey.set(e.storey,s)}
    const order=[...byStorey.keys()].sort((a,b)=>levelRank(a)-levelRank(b));

        ${so?`<ul>${[...groups.entries()].sort((a,b)=>entityName(a[0]).localeCompare(entityName(b[0]))).map(([cls,ids])=>`<li><div class="node" data-sel="${ids.join(",")}"><span class="caret"></span><span class="lbl" title="${esc(ifcPretty(cls))}">${esc(entityName(cls))}</span><span class="ct">${ids.length}</span></div></li>`).join("")}</ul>`:""}</li>`}).join("")}</ul>`:""}</li>`}).join("")}</ul>`;
}
function propsTable(rows){return `<table class="props"><tbody>${rows.filter(r=>r[1]!=null&&r[1]!=="").map(([k,v,cls])=>`<tr${k==="Entidade"?' class="hl"':""}><td>${esc(k)}</td><td class="${cls||""}">${esc(v)}</td></tr>`).join("")}</tbody></table>`}

/* ---------- 4. Regras ---------- */
function viewRegras(){

  return `<section class="view stack">
    <div><h1>Regras de análise</h1><p class="lede">Matriz de tolerância do Manual Corporativo de Clash Detection, filtros por entidade e PropertySet e as regras de pré-classificação. Alterações valem na próxima execução da análise.</p></div>

          <td><select data-tf="b">${groupOpts(t.b)}</select></td>

          <td style="font-size:12.5px">${esc(t.fonte||"Projeto")}</td><td style="font-size:12.5px">${esc(t.just||"")}</td></tr>`).join("")}</tbody></table></div>

    </div>

    <div class="grid2">

        ${P.filters.length?P.filters.map(f=>`<div class="row" data-filter="${f.id}" style="gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px">

          ${f.kind==="entity"?`<select data-ff="cls" style="flex:1">${(loadedClasses.length?loadedClasses:Object.keys(DEFAULT_ENTITY_NAMES)).map(c=>`<option value="${c}" ${c===f.cls?"selected":""}>${esc(entityName(c))} (${esc(ifcPretty(c))})</option>`).join("")}</select>`
          :`<input type="text" list="psetList" data-ff="pset" value="${esc(f.pset||"")}" placeholder="PropertySet" style="flex:1 1 130px">
            <input type="text" data-ff="prop" value="${esc(f.prop||"")}" placeholder="Propriedade" style="flex:1 1 100px">

            ${f.op==="existe"?"":`<input type="text" data-ff="value" value="${esc(f.value??"")}" placeholder="Valor" style="flex:1 1 90px">`}`}

        ${[...new Set([...loadedClasses,...Object.keys(DEFAULT_ENTITY_NAMES)])].map(c=>`<tr><td class="mono">${esc(ifcPretty(c))}</td><td><input type="text" data-ent="${c}" value="${esc(entityName(c))}" aria-label="Entidade para ${esc(c)}"></td></tr>`).join("")}
      </tbody></table></div>
