}

function geoSummary(run){
  if(!run.geo) return "";
  const g=run.geo,order=["confirmado","abaixo_tolerancia","contato","sem_conflito","inconclusivo","incompleto"];
  const parts=order.filter(k=>g[k]).map(k=>`<span class="num">${g[k]}</span> ${GEO_LABEL[k].toLowerCase()}`);
  const warn=[...(run.missing||[]).map(x=>`${x.n} elemento(s) de ${esc(x.file)} sem geometria processada ficaram fora da análise`),
    ...((run.partial||[]).length?[`${run.partial.length} elemento(s) com geometria parcial: ausência de conflito não é confirmada para eles`]:[]),
    ...(run.unitIssues||[]).map(f=>`unidade não confirmada em ${esc(f)}`)];
  const tp=run.topology||{};
  const topo=[["solido_valido","sólidos válidos"],["aberta","malhas abertas"],["invalida","malhas inválidas"],["superficie","superfícies sem volume"]].filter(([k])=>tp[k]).map(([k,l])=>`<span class="num">${tp[k]}</span> ${l}`).join(" · ");
  const lista=[...(run.missing||[]).flatMap(x=>x.items.map(u=>({file:x.file,guid:u.guid,cls:u.cls,eid:u.eid,motivo:"não processado — "+u.reason}))),
    ...(run.partial||[]).map(p=>({file:p.file,guid:p.guid,cls:p.cls,eid:p.eid,motivo:"parcial — "+p.failures.map(f=>`${f.stage}: ${f.reason}`).join("; ")}))];
  const P=proj(),hist=(P.runLog||[]).slice(-5).reverse();
  return `<div class="muted" style="font-size:12.5px">Pares verificados na geometria: ${parts.join(" · ")||"nenhum"}${topo?` · Elementos analisados: ${topo}`:""}</div>${warn.length?`<div style="font-size:12.5px;color:var(--p2)">${warn.join(" · ")}</div>`:""}
    ${lista.length?`<details style="font-size:12.5px"><summary class="muted" style="cursor:pointer">Elementos com falha de geometria (${lista.length})</summary><div class="tbl-wrap"><table><thead><tr><th>Arquivo</th><th>GUID</th><th>Entidade</th><th>#</th><th>Situação</th></tr></thead><tbody>${lista.slice(0,300).map(x=>`<tr><td>${esc(x.file)}</td><td class="mono">${esc(x.guid||"—")}</td><td>${esc(x.cls?entityName(x.cls):"—")}</td><td class="num">${x.eid}</td><td>${esc(x.motivo)}</td></tr>`).join("")}</tbody></table></div></details>`:""}
    ${hist.length>1?`<details style="font-size:12.5px"><summary class="muted" style="cursor:pointer">Histórico de análises (${(P.runLog||[]).length})</summary><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Pares</th><th>Listados</th><th>Confirmados</th><th>Inconclusivos</th><th>Incompletos</th><th>Geometria parcial / ausente</th></tr></thead><tbody>${hist.map(h=>`<tr><td class="num">${dateBR(h.date)}</td><td class="num">${h.pairs}</td><td class="num">${h.listed}</td><td class="num">${(h.geo||{}).confirmado||0}</td><td class="num">${(h.geo||{}).inconclusivo||0}</td><td class="num">${(h.geo||{}).incompleto||0}</td><td class="num">${h.partial||0} / ${h.missing||0}</td></tr>`).join("")}</tbody></table></div></details>`:""}`;
}
/* ---------- 5. Clashes por nível ---------- */
function viewClashes(){
  const P=proj();const cl=currentClashes();const run=S.lastRun[P.id];
  const tab=S.ui.clashTab;
  const real=cl.filter(c=>c.cls!=="FALSO"),fake=cl.filter(c=>c.cls==="FALSO");
  const list=tab==="real"?real:fake;
  const pend=cl.filter(c=>c.state!=="validado").length;
  const levels=new Map();for(const c of list){(levels.get(c.level)||levels.set(c.level,[]).get(c.level)).push(c)}
  const lvOrder=[...levels.keys()].sort((a,b)=>levelRank(a)-levelRank(b));
  return `<section class="view stack">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h1>Clashes por nível</h1><p class="lede" style="margin:0">${run?`Última análise em ${dateBR(run.date)} · ${run.tests} testes · ${fmt(run.pool)} de ${fmt(run.elements)} elementos analisados · ${run.ms} ms`:"A análise ainda não foi executada neste projeto."}</p></div>
      <button class="btn primary" data-run>Executar análise</button>
    </div>
    ${pend?`<div class="alert"><div class="grow"><b class="num">${pend} clashes foram pré-classificados automaticamente.</b> Revise a classificação antes de emitir os BCFs.${run&&run.geo&&((run.geo.inconclusivo||0)+(run.geo.incompleto||0))?` <b class="num">${(run.geo.inconclusivo||0)+(run.geo.incompleto||0)}</b> deles têm resultado geométrico inconclusivo ou incompleto e precisam de verificação no 3D.`:""}</div><button class="btn accent" data-nav="revisao">Revisar um por um</button></div>`:""}
    ${run?`<div class="row" style="justify-content:space-between">
      <div class="seg" role="group"><button data-ctab="real" aria-pressed="${tab==="real"}">A corrigir <span class="num">(${real.length})</span></button><button data-ctab="fake" aria-pressed="${tab==="fake"}">Falsos clashes <span class="num">(${fake.length})</span></button></div>
      <div class="muted" style="font-size:12.5px">${run.excluded.length?`${run.excluded.length} elementos excluídos por filtro · `:""}${run.below?`${run.below} interferências abaixo da tolerância ignoradas · `:""}${run.rejected?`${run.rejected} pares sem conflito ou só em contato`:""}</div></div>
      ${geoSummary(run)}`:""}
    ${!run?`<div class="empty">Configure os testes em <b>Regras de análise</b> e clique em <b>Executar análise</b>.</div>`:
      !list.length?`<div class="empty">${tab==="real"?"Nenhum clash a corrigir.":"Nenhum falso clash identificado."}</div>`:
      lvOrder.map(lv=>{const items=levels.get(lv);const counts=CLS_ORDER.map(k=>[k,items.filter(c=>c.cls===k).length]).filter(x=>x[1]);
      return `<details class="lvl" open><summary><span class="name">${esc(lv)}</span><span class="count num">${items.length} ${items.length===1?"clash":"clashes"}</span><span class="chips">${counts.map(([k,n])=>`<span class="chip ${k}">${k==="FALSO"?"Falso":k} · ${n}</span>`).join("")}</span></summary>
        <div class="tbl-wrap"><table><thead><tr><th>Título</th><th>Teste</th><th>Elemento A</th><th>Elemento B</th><th>${tab==="real"?"Penetração / folga":"Valor"}</th><th>Classificação</th><th>Responsável</th><th>Situação</th></tr></thead>
        <tbody>${items.map(c=>{const A=ELEMS[c.a],B=ELEMS[c.b];return `<tr class="click" data-open-clash="${esc(c.id)}">
          <td class="mono">${esc(c.title)}</td><td style="font-size:12.5px">${esc(c.testName)}</td>
          <td>${esc(entityName(A.cls))}<div class="muted" style="font-size:12px">${esc(A.code)} · ${esc(A.name)}</div></td>
          <td>${esc(entityName(B.cls))}<div class="muted" style="font-size:12px">${esc(B.code)} · ${esc(B.name)}</div></td>
          <td class="num">${geoValueText(c)}${geoChip(c)}<div class="muted" style="font-size:12px">tol. ${c.tol} mm</div></td>
          <td><span class="chip ${c.cls}">${CLASSES[c.cls].label}</span></td>
          <td style="font-size:12.5px">${esc(c.resp?memberName(c.resp):"—")}</td>
          <td>${c.state==="validado"?'<span class="chip ok">Validado</span>':'<span class="chip sug">Sugerido</span>'}</td></tr>`}).join("")}</tbody></table></div></details>`}).join("")}
  </section>`;
}

/* ---------- 6. Revisão ---------- */
function viewRevisao(){
  return `<section class="view full"><div class="rlayout">
    <aside class="vside left"><div class="hd"><h2>Fila de revisão</h2>
      <div class="seg" style="margin-top:8px" role="group"><button data-rfilter="pendentes" aria-pressed="${S.ui.reviewFilter==="pendentes"}">Pendentes</button><button data-rfilter="todos" aria-pressed="${S.ui.reviewFilter==="todos"}">Todos</button><button data-rfilter="falsos" aria-pressed="${S.ui.reviewFilter==="falsos"}">Falsos</button></div></div>
      <div id="queue"></div></aside>
    <div class="slot" id="rslot"></div>
    <aside class="vside right" id="rcard"></aside>
  </div></section>`;
}
function queueItems(){
  const f=S.ui.reviewFilter;const cl=currentClashes();
  const items=f==="pendentes"?cl.filter(c=>c.state!=="validado"):f==="falsos"?cl.filter(c=>c.cls==="FALSO"):cl;
  return [...items].sort((x,y)=>levelRank(x.level)-levelRank(y.level)||CLS_ORDER.indexOf(x.cls)-CLS_ORDER.indexOf(y.cls));
}
function renderQueue(){
  const host=$("#queue");if(!host) return;const items=queueItems();
  if(!currentClashes().length){host.innerHTML=`<div class="empty" style="margin:12px">Execute a análise para gerar a fila.<div style="margin-top:8px"><button class="btn small primary" data-run>Executar análise</button></div></div>`;return}
  if(!items.length){host.innerHTML=`<div class="empty" style="margin:12px">${S.ui.reviewFilter==="pendentes"?"Tudo revisado. Os issues estão prontos para o BCF.":"Nada aqui."}</div>`;return}
  let lv=null;
  host.innerHTML=items.map(c=>{const h=c.level!==lv?`<div class="qgroup">${esc(c.level)}</div>`:"";lv=c.level;const A=ELEMS[c.a],B=ELEMS[c.b];
    return h+`<div class="qitem ${S.ui.reviewSel===c.id?"sel":""}" data-q="${esc(c.id)}"><span class="chip ${c.cls}" style="min-width:44px;justify-content:center">${c.cls==="FALSO"?"Falso":c.cls}</span>
      <div style="min-width:0"><div class="t mono">${esc(c.title)} ${c.state==="validado"?'<span style="color:var(--ok)">✓</span>':""}</div><div class="s">${esc(entityName(A.cls))} × ${esc(entityName(B.cls))}</div></div></div>`}).join("");
}
function geoDetails(c){
  const g=c.geo;if(!g) return "";
  if(c.kind==="hard"&&g.state==="confirmado"&&!g.volume&&ELEMS[c.a].geoms.length&&ELEMS[c.b].geoms.length){
    try{const v=g.metricQuality==="garantida"?GEOC.pairVolume(solidOf(ELEMS[c.a]),solidOf(ELEMS[c.b]),20000):null; // volume só com garantia
      if(v){g.volume={vmin:v.vmin,vmax:v.vmax};g.extent=v.extent;if(!v.exact&&v.vmax-v.vmin>1e-12&&!g.flags.includes("volume_por_intervalo")) g.flags.push("volume_por_intervalo")}else g.volume=null}catch(e){console.warn("COORDIX: volume",e)}
  }
  const m3=v=>v>=1e-3?fmt(v*1000,2)+" L":fmt(v*1e6,1)+" cm³";
  const rows=[`<span>Resultado geométrico</span><span>${esc(GEO_LABEL[g.state]||g.state)}${g.quality==="aproximada"?' <span class="chip outline">aproximado</span>':""}${g.method==="convexo_exato"?' <span class="muted" style="font-size:12px">· cálculo exato (peças convexas)</span>':g.method==="ramo_e_limite"?' <span class="muted" style="font-size:12px">· cálculo por limites</span>':""}</span>`];
  if(c.kind==="hard"&&g.metricQuality) rows.push(`<span>Confiabilidade da espessura</span><span>${esc(METRIC_LABEL[g.metricQuality]||g.metricQuality)}${g.evidence==="superficies"?' <span class="muted" style="font-size:12px">· só as superfícies puderam ser comparadas</span>':""}</span>`);
  if(c.kind==="hard"&&g.lb!=null&&g.ub!=null&&g.ub-g.lb>0.0005&&g.metricQuality==="garantida") rows.push(`<span>Intervalo da espessura</span><span class="num">${fmt(g.lb*1000,1)} a ${fmt(g.ub*1000,1)} mm</span>`);
  if(c.kind==="hard"&&g.lb!=null&&g.ub==null&&g.metricQuality==="garantida") rows.push(`<span>Intervalo da espessura</span><span class="num">pelo menos ${fmt(g.lb*1000,1)} mm <span class="muted" style="font-size:12px">(sem limite superior garantido)</span></span>`);
  const integ=[c.a,c.b].map((i,k)=>{const e=ELEMS[i];return e.geoIntegrity&&e.geoIntegrity!=="completa"?`${k?"B":"A"}: geometria ${e.geoIntegrity==="parcial"?"parcial":"não processada"} (${(e.geoFailures||[]).length} falha(s))`:""}).filter(Boolean);
  if(integ.length) rows.push(`<span>Integridade</span><span style="font-size:12.5px;color:var(--p2)">${esc(integ.join(" · "))}</span>`);
  if(g.otherTests&&g.otherTests.length) rows.push(`<span>Outros testes</span><span style="font-size:12.5px">${g.otherTests.map(o=>`${esc(o.testName)} (tol. ${o.tol} mm): ${esc(GEO_LABEL[o.state]||o.state)}`).join("; ")}</span>`);
  if(g.volume) rows.push(`<span>Volume de interseção</span><span class="num">${g.volume.vmax-g.volume.vmin<=1e-12?m3(g.volume.vmin):`${m3(g.volume.vmin)} a ${m3(g.volume.vmax)}`}</span>`);
  if(g.extent) rows.push(`<span>Região de interseção</span><span class="num">${[0,1,2].map(k=>fmt((g.extent[k+3]-g.extent[k])*1000,0)).join(" × ")} mm <span class="muted" style="font-size:12px">(caixa, não é a penetração)</span></span>`);
  if(g.flags&&g.flags.length) rows.push(`<span>Observações</span><span style="font-size:12.5px">${g.flags.map(f=>esc(geoFlagText(f))).join("; ")}</span>`);
  return rows.join("");
}

function focusClash(c){
  if(!c) return;
  V.pair=[c.a,c.b];V.pairFocus=null;V.sel=[];clearHL();clearGroup(V.iso);
  V.iso.add(subsetMesh([c.a],new THREE.Color("#e5322b"),{offset:-1}),subsetMesh([c.b],new THREE.Color("#3f6fdb"),{offset:-1}));setGhost(true);
  const box=boxOf([c.a,c.b]);
  const ib=new THREE.Box3().copy(ELEMS[c.a].box).intersect(ELEMS[c.b].box);
  const focus=ib.isEmpty()?box:ib.expandByScalar(Math.max(0.8,ib.getSize(new THREE.Vector3()).length()));
  fitView(focus.clone().union(new THREE.Box3().setFromCenterAndSize(focus.getCenter(new THREE.Vector3()),new THREE.Vector3(2.5,2.5,2.5))));
  const lg=$("#vlegend");lg.hidden=false;
  lg.innerHTML=`<div><i style="background:#e5322b"></i>A · ${esc(entityName(ELEMS[c.a].cls))}</div><div><i style="background:#3f6fdb"></i>B · ${esc(entityName(ELEMS[c.b].cls))}</div><div class="muted">${esc(c.level)}</div>`;
  setStatus(`${c.title} · ${c.level}`);
}
function reviewAction(kind){

  if(kind==="skip"){const n=items[i+1]||items[0];if(n){S.ui.reviewSel=n.id;renderQueue();renderReviewCard(true)}return}
  if(kind==="prev"){const n=items[i-1];if(n){S.ui.reviewSel=n.id;renderQueue();renderReviewCard(true)}return}
  const cls=kind==="fake"?"FALSO":$("#rvCls").value;
  const resp=cls==="FALSO"?"":$("#rvResp").value;
  const txt=($("#rvComment").value||"").trim();
  if(txt) c.comments.push({date:new Date().toISOString(),author:coordinator().name,text:txt});
  c.topicType=$("#rvType").value;
  const wasPending=c.state!=="validado";
  validate(c,{cls,resp});
  const after=queueItems();
  let next=null;
  if(wasPending){next=after.find((x,k)=>k>=Math.max(0,i)&&x!==c&&x.state!=="validado")||after.find(x=>x.state!=="validado")}
  S.ui.reviewSel=next?next.id:c.id;
  renderNav();renderQueue();renderReviewCard(!!next);
  if(wasPending) toast(cls==="FALSO"?"Marcado como falso clash.":`Validado: ${CLASSES[cls].label}${c.issueIndex?` · Issue #${c.issueIndex}`:""}`);
  if(!pendingCount()&&wasPending) toast("Revisão concluída. Os issues estão prontos para o BCF 2.1.");
}

async function handleFiles(files){
  const P=proj();files=[...files]; // cópia: o <input> é limpo logo após o evento e não pode esvaziar esta lista
  const ifcs=files.filter(f=>/\.ifc$/i.test(f.name));
  for(const f of files) if(!ifcs.includes(f)) toast(`${f.name} não é um arquivo .ifc.`);
  for(let k=0;k<ifcs.length;k++){
    const f=ifcs[k];
    progress.show({title:"Leitura de modelos IFC",stage:"Carregando o arquivo",detail:`Arquivo ${k+1} de ${ifcs.length} · ${f.name} · ${fmtSize(f.size)}`});
    const cam=window.coordixDesktop&&window.coordixDesktop.origemDoArquivo?window.coordixDesktop.origemDoArquivo(f):null;
    await loadIfc(P.id,f.name,await f.arrayBuffer(),{caminho:cam}); // sem cópia retida aqui: o leitor libera o arquivo bruto após a abertura
  }
  progress.hide();
  if(ifcs.length) toast("Modelos lidos. Execute a análise em Clashes por nível.");
}
/* etapa da leitura do IFC: atualiza o painel e devolve o controle ao navegador para desenhá-lo
   (cada etapa do leitor é uma operação única do web-ifc, sem contagem parcial: indicador indeterminado) */
/* mensagens do leitor IFC em linguagem compreensível (o texto técnico original fica no console) */
function ifcErrorText(e){
  const t=String((e&&e.message)||e||"");
  if(/Aborted|abort\(/i.test(t)) return "o leitor IFC interrompeu a leitura deste arquivo (estrutura não suportada ou memória do leitor esgotada). Tente abrir o arquivo sozinho num projeto novo; se persistir, envie o arquivo para análise";
  if(/memory|allocation|out of bounds/i.test(t)) return "memória insuficiente no leitor IFC para este arquivo";
  return t;
}
async function loadStage(t){progress.update({stage:t,done:null,total:null});await new Promise(r=>setTimeout(r,20))}
function fmtSize(b){return b>=1048576?`${(b/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})} MB`:`${Math.max(1,Math.round(b/1024))} kB`}
function removeModel(id){
  const P=proj();const list=S.models[P.id]||[];const m=list.find(x=>x.id===id);if(!m) return;
  for(const c of m.chunks){V.root.remove(c);c.geometry.dispose();c.material.dispose()}
  forgetAnalysisMeshes(m.elems);
  unlinkModelRef(P,m); // remover do projeto ≠ apagar o arquivo: o IFC no disco nunca é tocado
  for(const i of m.elems){ELEMS[i].geoms=[];ELEMS[i]._solid=null;ELEMS[i]._topo=null}
  try{if(m.mid!=null) api.CloseModel(m.mid)}catch(e){}
  S.models[P.id]=list.filter(x=>x!==m);
  if(!S.models[P.id].length&&P.origemLocal){delete P.origemLocal;save()} // sem modelos: o próximo IFC define a nova origem do projeto
  S.clashes[P.id]=(S.clashes[P.id]||[]).filter(c=>ELEMS[c.a].model!==id&&ELEMS[c.b].model!==id);
  selectElements([],{silent:true});V.dirty=true;renderAll();
}

/* =====================================================================
   Projetos: Novo, Abrir, Salvar, Salvar como, Excluir (formato .coordix)
   ---------------------------------------------------------------------
   .coordix = JSON versionado: {formato:"coordix-projeto", versao, salvoEm, app, projeto, modelos, resultados}
   - projeto: TODOS os dados do projeto (equipe, regras, filtros, nomes de Entidade, ordem de flexibilidade,
     decisões do coordenador por par de GUIDs: classificação, responsável, comentários, histórico, snapshots,
     issues e viewpoints, além do histórico de análises);
   - modelos: REFERÊNCIAS aos IFCs (nome, disciplina, tamanho, SHA-256 e, no desktop, caminho absoluto e
     relativo ao .coordix). Os IFCs não são copiados; ao reabrir, cada um é localizado e conferido pela assinatura;
   - resultados: retrato da última análise (clashes por GUID e resumo), para conferência ao reabrir.
   Ao reabrir com os IFCs disponíveis, a análise é refeita e as decisões salvas são reaplicadas pelos GUIDs.
   ===================================================================== */
const PROJ_FORMAT="coordix-projeto",PROJ_VERSION=1;
const SAVED_SIG={}; // projeto → assinatura do conteúdo no último salvar/abrir (indicador "não salvo")
async function sha256Hex(buf){
  try{const h=await crypto.subtle.digest("SHA-256",buf instanceof ArrayBuffer?buf:buf.buffer);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
  catch(e){return null}
}
function sigOf(P){const t=JSON.stringify({...P,arquivo:undefined});let h=0;for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0;return h+":"+t.length}
function linkModelRef(pid,m){
  const P=DB.projects.find(p=>p.id===pid);if(!P||P.example) return;
  P.modelos=P.modelos||[];
  const ref={arquivo:m.file,codigo:m.code||"",tamanho:m.size,sha256:m.sha256||null,caminho:m.caminho||null,vinculadoEm:new Date().toISOString()};
  const i=P.modelos.findIndex(r=>r.arquivo===m.file);
  if(i>=0) P.modelos[i]={...P.modelos[i],...ref,vinculadoEm:P.modelos[i].vinculadoEm||ref.vinculadoEm}; else P.modelos.push(ref);
  m.ref=ref.arquivo;save();
}
function unlinkModelRef(P,m){if(!P.modelos) return;P.modelos=P.modelos.filter(r=>r.arquivo!==m.file);save()}
function cleanForFile(v,depth=0){ // cópia só com dados serializáveis (sem elementos 3D nem referências circulares)
  if(v==null||typeof v!=="object") return typeof v==="function"?undefined:v;
  if(depth>8) return undefined;
  if(Array.isArray(v)) return v.map(x=>cleanForFile(x,depth+1));
  if(v.isObject3D||v.isVector3||v.isBox3) return undefined;
  const o={};for(const k in v){if(k==="el"||k==="m"||k==="geoms") continue;const x=cleanForFile(v[k],depth+1);if(x!==undefined) o[k]=x}return o;
}
function buildProjectFile(P){
  const clashes=(S.clashes[P.id]||[]).map(c=>{const A=ELEMS[c.a],B=ELEMS[c.b];const o=cleanForFile({...c,a:undefined,b:undefined});
    return {...o,guidA:A&&A.guid,guidB:B&&B.guid,arquivoA:A&&A.m.file,arquivoB:B&&B.m.file}});
  const lr=S.lastRun[P.id];
  const resumo=lr?cleanForFile({...lr,excluded:undefined,excluidos:(lr.excluded||[]).map(x=>({guid:x.el.guid,arquivo:x.el.m.file,motivo:x.why}))}):null;
  const proj=cleanForFile(P);delete proj.arquivo;delete proj.modelos; // modelos vão na seção própria
  return {formato:PROJ_FORMAT,versao:PROJ_VERSION,salvoEm:new Date().toISOString(),
    app:{edicao:window.coordixDesktop?"desktop":"web",versaoWeb:WEB_VERSION},
    projeto:proj,modelos:(P.modelos||[]).map(r=>({arquivo:r.arquivo,codigo:r.codigo,tamanho:r.tamanho,sha256:r.sha256,caminho:r.caminhoAtual||r.caminho||null,vinculadoEm:r.vinculadoEm})),
    resultados:{ultimaAnalise:resumo,clashes}};
}
function parseProjectFile(text){
  let o;try{o=JSON.parse(text)}catch(e){throw new Error("o arquivo de projeto está corrompido ou incompleto (JSON inválido)")}
  if(!o||o.formato!==PROJ_FORMAT) throw new Error("este arquivo não é um projeto COORDIX (.coordix)");
  if(!Number.isInteger(o.versao)||o.versao<1) throw new Error("versão do arquivo de projeto inválida");
  if(o.versao>PROJ_VERSION) throw new Error(`o projeto foi salvo numa versão mais nova do COORDIX (formato ${o.versao}); atualize o aplicativo para abri-lo`);
  if(!o.projeto||!o.projeto.id) throw new Error("o arquivo não contém os dados do projeto");
  return o;
}
function completeProject(p){ // mesmos acréscimos aplicados aos projetos salvos no navegador
  const d=defaultSettings();for(const k in d) if(p[k]===undefined) p[k]=d[k];
  for(const t of DEFAULT_TESTS) if(!p.tests.some(x=>x.id===t.id)) p.tests.push({...t});
  if(!p.flexOrder.includes("MET")){const i=p.flexOrder.indexOf("EST");p.flexOrder.splice(i<0?0:i+1,0,"MET")}
  p.modelos=p.modelos||[];return p;
}
function confirmDialog({title,body,actions}){

  $("#confirmActions").innerHTML=actions.map((a,i)=>`<button class="btn ${a.kind||""}" type="button" data-i="${i}">${esc(a.label)}</button>`).join("");
  return new Promise(res=>{
    const done=v=>{dlg.close();res(v)};
    $("#confirmActions").onclick=e=>{const b=e.target.closest("[data-i]");if(b) done(actions[+b.dataset.i].value)};
    dlg.oncancel=e=>{e.preventDefault();done(null)};
    dlg.showModal();const def=$("#confirmActions").querySelector(".btn:not(.danger)");def&&def.focus();
  });
}
function toggleProjMenu(force){const m=$("#projMenu"),b=$("#projMenuBtn");const open=force===undefined?m.hidden:force;m.hidden=!open;b.setAttribute("aria-expanded",String(open));if(open) m.querySelector("button").focus()}

async function salvarProjeto(comoNovo){
  const P=proj();
  if(P.example&&!comoNovo){const r=await confirmDialog({title:"Salvar projeto de exemplo",body:"<p>O projeto de exemplo é recriado a cada abertura. Para guardar este conteúdo, use <b>Salvar como</b>: será criado um arquivo .coordix com uma cópia dele.</p>",actions:[{label:"Cancelar",value:null},{label:"Salvar como…",value:1,kind:"primary"}]});if(!r) return;comoNovo=true}

      const r=await window.coordixDesktop.projeto.salvar({conteudo,caminho:P.arquivo&&P.arquivo.caminho,comoNovo:!!comoNovo,nomeSugerido:P.name});

      const a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
      P.arquivo={nome,salvoEm:new Date().toISOString()};
    }
    SAVED_SIG[P.id]=sigOf(P);save();renderProjFile();

async function abrirProjeto(){
  try{
    let texto,info=null;
    if(window.coordixDesktop&&window.coordixDesktop.projeto){info=await window.coordixDesktop.projeto.abrir();if(!info) return;texto=info.conteudo}
    else{const f=await pickFile($("#projInput"));if(!f) return;texto=await f.text();info={nome:f.name,caminho:null,ifcs:null}}
    const o=parseProjectFile(texto);
    let p=completeProject(o.projeto);
    const existente=DB.projects.find(x=>x.id===p.id);
    if(existente){
      const r=await confirmDialog({title:"Projeto já existe no COORDIX",
        body:`<p>O projeto <b>${esc(p.name)}</b> já está no COORDIX. Substituir pelo conteúdo do arquivo (salvo em ${esc(dateBR(o.salvoEm))}) ou abrir como uma cópia separada?</p><p class="muted" style="margin-top:8px">Substituir troca equipe, regras e decisões pelas do arquivo. Nenhum IFC é alterado.</p>`,
        actions:[{label:"Cancelar",value:null},{label:"Abrir como cópia",value:"copia"},{label:"Substituir",value:"substituir",kind:"primary"}]});
      if(!r) return;
      if(r==="copia"){p={...p,id:uid(),name:p.name+" (cópia)"}}
      else{for(const m of [...(S.models[existente.id]||[])]){DB.current=existente.id;removeModel(m.id)}DB.projects=DB.projects.filter(x=>x!==existente);delete S.clashes[existente.id];delete S.lastRun[existente.id]}
    }
    p.arquivo=info.caminho?{caminho:info.caminho,nome:info.nome,salvoEm:o.salvoEm}:{nome:info.nome,salvoEm:o.salvoEm};
    // situação dos IFCs: no desktop, conferida no disco; no navegador, o usuário seleciona os arquivos
    const sit=info.ifcs||[];
    p.modelos=(o.modelos||[]).map((r,i)=>({...r,situacao:sit[i]?sit[i].situacao:"selecionar",caminhoAtual:sit[i]&&sit[i].caminho||null,shaAtual:sit[i]&&sit[i].sha256||null}));
    S.savedResult=S.savedResult||{};S.savedResult[p.id]=o.resultados||null;
    DB.projects.push(p);switchProject(p.id);SAVED_SIG[p.id]=sigOf(p);go("modelos");renderProjFile();
    const ok=p.modelos.filter(r=>r.situacao==="encontrado");
    toast(`Projeto ${p.name} aberto.${p.modelos.length?` ${ok.length} de ${p.modelos.length} IFCs encontrados.`:""}`);
    if(ok.length) await carregarVinculados(p,ok);
  }catch(e){console.error(e);toast(`Não foi possível abrir o projeto: ${e.message||e}`)}
}
function pickFile(input,multi){return new Promise(res=>{input.value="";input.onchange=()=>res(multi?[...input.files]:input.files[0]||null);input.click()})}
async function carregarVinculados(P,refs){
  if(!refs.length) return;
  let n=0;
  for(let k=0;k<refs.length;k++){const r=refs[k];
    if((S.models[P.id]||[]).some(m=>m.file===r.arquivo&&m.status!=="erro")) continue;
    progress.show({title:"Reabrindo modelos do projeto",stage:"Lendo o arquivo do disco",detail:`Modelo ${k+1} de ${refs.length} · ${r.arquivo}`});
    try{const f=await window.coordixDesktop.ifc.ler(r.caminhoAtual||r.caminho);
      await loadIfc(P.id,r.arquivo,f.bytes.buffer.slice(f.bytes.byteOffset,f.bytes.byteOffset+f.bytes.byteLength),{caminho:f.caminho,sha256:f.sha256});
      const m=(S.models[P.id]||[]).find(x=>x.file===r.arquivo);if(m&&r.codigo&&m.code!==r.codigo) setModelCode(P,m,r.codigo);
      r.situacao="carregado";n++}
    catch(e){console.error(e);r.situacao="ausente";toast(`Não foi possível reabrir ${r.arquivo}: ${e.message||e}`)}
  }
  progress.hide();save();renderAll();
  if(n) await reanalisarComDecisoes(P);
}
function setModelCode(P,m,code){m.code=code;m.disc=(CODE_INFO[code]||["A definir"])[0];m.group=(CODE_INFO[code]||[null,null])[1];for(const i of m.elems){ELEMS[i].group=m.group;ELEMS[i].code=code}}
async function reanalisarComDecisoes(P){
  if(DB.current!==P.id) return;
  await runAnalysis(); // as decisões salvas (por par de GUIDs) são reaplicadas pela própria análise
  const sv=S.savedResult&&S.savedResult[P.id];
  if(sv&&sv.clashes){const agora=(S.clashes[P.id]||[]).length,antes=sv.clashes.length;
    if(agora!==antes) toast(`Atenção: a análise atual tem ${agora} clashes e o projeto salvo tinha ${antes}. Verifique se os IFCs ou as regras mudaram.`)}
}
function linkedPanel(P){
  if(P.example||!(P.modelos||[]).length) return "";

      <span class="chip ${r.situacao==="encontrado"?"ok":r.situacao==="alterado"?"geo":"outline"}">${esc(label[r.situacao]||(desk&&r.caminho?"vinculado":"selecione o arquivo"))}</span>
      <span class="grow muted mono" title="${esc(r.caminhoAtual||r.caminho||"")}">${esc(r.caminhoAtual||r.caminho||"")}</span>
      ${desk&&(r.caminhoAtual||r.caminho)&&r.situacao!=="ausente"?`<button class="btn small" data-link="carregar" data-i="${i}">${r.situacao==="alterado"?"Carregar mesmo assim":"Carregar"}</button>`:""}
      <button class="btn small" data-link="localizar" data-i="${i}">Localizar…</button>

    ${pend.length>1&&desk?`<div><button class="btn small primary" data-link="todos" data-i="0">Carregar todos os encontrados</button></div>`:""}</div>`;

async function linkedAction(act,i){
  const P=proj();const r=P.modelos[i];if(!r&&act!=="todos") return;
  const desk=!!(window.coordixDesktop&&window.coordixDesktop.ifc);
  if(act==="esquecer"){P.modelos.splice(i,1);save();renderAll();return}
  if(act==="todos"){await carregarVinculados(P,P.modelos.filter(x=>x.situacao!=="ausente"&&(x.caminhoAtual||x.caminho)));return}
  if(act==="carregar"){await carregarVinculados(P,[r]);return}
  if(act==="localizar"){
    let f,meta=null;
    if(desk){const x=await window.coordixDesktop.ifc.localizar(r.arquivo);if(!x) return;
      f={name:x.nome,bytes:x.bytes.buffer.slice(x.bytes.byteOffset,x.bytes.byteOffset+x.bytes.byteLength)};meta={caminho:x.caminho,sha256:x.sha256}}
    else{const fl=await pickFile($("#relinkInput"));if(!fl) return;f={name:fl.name,bytes:await fl.arrayBuffer()};meta={caminho:null,sha256:await sha256Hex(f.bytes)}}
    if(r.sha256&&meta.sha256&&r.sha256!==meta.sha256){
      const ok=await confirmDialog({title:"Arquivo diferente do vinculado",body:`<p>O arquivo escolhido (<b>${esc(f.name)}</b>) não é idêntico ao IFC salvo no projeto (<b>${esc(r.arquivo)}</b>): a assinatura é diferente. Pode ser uma revisão do modelo.</p><p class="muted" style="margin-top:8px">Se usar este arquivo, a análise será refeita com ele e o vínculo passa a apontar para ele.</p>`,
        actions:[{label:"Cancelar",value:null},{label:"Usar este arquivo",value:1,kind:"primary"}]});
      if(!ok) return;
    }
    P.modelos.splice(i,1);save();
    await loadIfc(P.id,f.name,f.bytes,meta);
    const m=(S.models[P.id]||[]).find(x=>x.file===f.name);if(m&&r.codigo&&m.code!==r.codigo) setModelCode(P,m,r.codigo);

  }
}

const THEME_KEY="coordix.tema";
const sysDark=matchMedia("(prefers-color-scheme: dark)");
function effectiveTheme(){const t=document.documentElement.getAttribute("data-theme");return t==="light"||t==="dark"?t:(sysDark.matches?"dark":"light")}
function syncThemeToggle(){const t=effectiveTheme();document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===t)))}
function setTheme(t){
  const html=document.documentElement;
  html.classList.add("theme-anim");clearTimeout(setTheme.t);setTheme.t=setTimeout(()=>html.classList.remove("theme-anim"),320);
  html.setAttribute("data-theme",t); // o visualizador acompanha via MutationObserver (updateViewerTheme)
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  syncThemeToggle();
}
document.querySelector(".theme-tg").addEventListener("click",e=>{const b=e.target.closest("[data-theme-set]");if(b) setTheme(b.dataset.themeSet)});
sysDark.addEventListener?.("change",syncThemeToggle);
